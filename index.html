<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEMO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
  <style>
    /* 미니멀 에디터 스타일 */
    .ql-toolbar.ql-snow {
      border: none !important;
      border-bottom: 1px solid #e5e7eb !important;
      padding: 10px 0 !important;
    }
    .ql-container.ql-snow {
      border: none !important;
      font-size: 15px;
      min-height: 400px;
    }
    .ql-editor {
      padding: 20px 0 !important;
    }
    .ql-editor.ql-blank::before {
      color: #9ca3af;
      font-style: normal;
      left: 0 !important;
    }
    /* 버튼 트랜지션 */
    .toggle-btn {
      transition: all 0.2s ease-in-out;
    }
  </style>
</head>
<body class="bg-white min-h-screen flex items-center justify-center text-gray-900 font-sans antialiased">

  <!-- 1. LOGIN VIEW (캡처본 참고하여 직선적이고 미니멀하게 구성) -->
  <div id="loginView" class="w-full max-w-sm border border-gray-200 p-8 space-y-6">
    <h1 class="text-lg font-bold tracking-widest">LOG IN</h1>
    <div class="space-y-4">
      <input type="email" id="emailInput" placeholder="EMAIL" class="w-full p-3 border border-gray-200 text-sm focus:outline-none focus:border-black transition">
      <input type="password" id="passwordInput" placeholder="PASSWORD" class="w-full p-3 border border-gray-200 text-sm focus:outline-none focus:border-black transition">
      <button id="loginBtn" class="w-full py-4 bg-black text-white text-sm tracking-widest font-bold hover:bg-gray-800 transition">ENTRANCE</button>
    </div>
    <p id="loginError" class="text-xs text-red-500 min-h-[16px]"></p>
  </div>

  <!-- 2. MAIN MEMO VIEW (제목 없음, 수정/분류 타원형 버튼) -->
  <div id="mainView" class="hidden w-full max-w-3xl p-6 space-y-4">
    
    <!-- HEADER (타원형 토글 버튼 및 로그아웃) -->
    <div class="flex justify-between items-center pb-4 border-b border-gray-100">
      <div class="flex gap-2">
        <button id="editBtn" class="toggle-btn px-5 py-1.5 rounded-full border border-gray-300 text-sm text-gray-600 hover:border-gray-500 focus:outline-none">수정</button>
        <button id="categoryBtn" class="toggle-btn px-5 py-1.5 rounded-full border border-gray-300 text-sm text-gray-600 hover:border-gray-500 focus:outline-none">분류</button>
      </div>
      <button id="logoutBtn" type="button" class="text-xs text-gray-400 hover:text-black transition">
        SIGN OUT
      </button>
    </div>

    <!-- WYSIWYG EDITOR -->
    <div id="editor"></div>

    <!-- ACTION BAR -->
    <div class="flex justify-between items-center pt-4 border-t border-gray-100">
      <span id="statusText" class="text-xs text-gray-400 font-mono"></span>
      <button id="saveBtn" type="button" class="px-6 py-2.5 bg-black hover:bg-gray-800 text-white font-medium text-sm rounded-full transition disabled:bg-gray-300">
        저장
      </button>
    </div>
  </div>

  <!-- FIREBASE & LOGIC -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 전달받은 Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyAagWKtXuvQOhV-__Mxmd5ys8vs0xDDCUs",
      authDomain: "water-log132.firebaseapp.com",
      projectId: "water-log132",
      storageBucket: "water-log132.firebasestorage.app",
      messagingSenderId: "569667354916",
      appId: "1:569667354916:web:6cc37173ed1c9c2cf7f3b1",
      measurementId: "G-2L6JGTPD41"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Quill 에디터 초기화
    const quill = new Quill('#editor', {
      theme: 'snow',
      placeholder: '내용을 입력하세요...',
      modules: {
        toolbar: [
          [{ 'header': [1, 2, false] }],
          ['bold', 'underline', 'strike'],
          [{ 'list': 'ordered'}, { 'list': 'bullet' }],
          ['blockquote', 'link'],
          ['clean']
        ]
      }
    });

    const loginView = document.getElementById('loginView');
    const mainView = document.getElementById('mainView');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const loginError = document.getElementById('loginError');

    // UI 토글 버튼 로직 (누르면 네이비/블랙 계열로 색상 반전)
    const toggleActiveState = (buttonElement) => {
      buttonElement.classList.toggle('bg-slate-900'); // 네이비/블랙 톤
      buttonElement.classList.toggle('text-white');
      buttonElement.classList.toggle('border-slate-900');
      buttonElement.classList.toggle('text-gray-600');
      buttonElement.classList.toggle('border-gray-300');
    };

    document.getElementById('editBtn').addEventListener('click', function() {
      toggleActiveState(this);
    });

    document.getElementById('categoryBtn').addEventListener('click', function() {
      toggleActiveState(this);
    });

    // 로그인 상태 감지
    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginView.classList.add('hidden');
        mainView.classList.remove('hidden');
      } else {
        mainView.classList.add('hidden');
        loginView.classList.remove('hidden');
      }
    });

    // 로그인 실행
    loginBtn.addEventListener('click', async () => {
      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passwordInput').value.trim();
      loginError.innerText = '';

      if (!email || !password) {
        loginError.innerText = '이메일과 비밀번호를 입력해.';
        return;
      }

      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        console.error("Login failed:", err);
        loginError.innerText = '로그인 실패. 계정 정보를 확인해.';
      }
    });

    // 로그아웃
    logoutBtn.addEventListener('click', async () => {
      try {
        await signOut(auth);
      } catch (err) {
        console.error('Logout error:', err);
      }
    });

    // 메모 저장
    const saveBtn = document.getElementById('saveBtn');
    const statusText = document.getElementById('statusText');

    saveBtn.addEventListener('click', async () => {
      const htmlContent = quill.root.innerHTML;
      const textContent = quill.getText().trim();

      if (!textContent) {
        statusText.innerText = '내용이 없어.';
        return;
      }

      saveBtn.disabled = true;
      statusText.innerText = '저장 중...';

      try {
        await addDoc(collection(db, "memos"), {
          content: htmlContent,
          rawText: textContent,
          createdAt: serverTimestamp()
        });

        quill.setText('');
        statusText.innerText = '저장 완료';
        setTimeout(() => { statusText.innerText = ''; }, 2000);
      } catch (err) {
        console.error('Firestore save error:', err);
        statusText.innerText = '저장 에러 발생';
      } finally {
        saveBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
