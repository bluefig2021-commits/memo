<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEMO</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: clamp(12px, 4vw, 48px) 16px; color: #333; margin: 0; background: #fff; }
    .frame { max-width: 800px; margin: 0 auto; box-sizing: border-box; background: #fff; border: 1px solid #e3e3e3; border-radius: 24px; padding: clamp(20px, 4vw, 40px); }

    #loginView { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 50vh; gap: 20px; }
    .title-logo { font-size: 12px; letter-spacing: 4px; color: #aaa; font-weight: bold; }
    #mainView { display: none; }
    .screen { display: none; }
    .screen.on { display: block; }

    .header { display: flex; align-items: center; gap: 20px; border-bottom: 1px solid #eee; padding-bottom: 15px; margin-bottom: 20px; flex-wrap: wrap; }
    .btn { padding: 5px 15px; border: 1px solid #ccc; border-radius: 15px; background: #fff; cursor: pointer; font-size: 12px; letter-spacing: 1px; color: #888; }
    .btn-black { background: #000; color: #fff; border: none; padding: 10px 30px; border-radius: 20px; font-weight: bold; font-size: 14px; letter-spacing: 1px; cursor: pointer; }
    .btn-black:disabled { opacity: .5; }

    .category-wrapper { display: flex; align-items: center; gap: 10px; }
    .category-label { font-size: 12px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
    .category-tag { border: 1px solid #0f172a; background: #0f172a; color: #fff; border-radius: 20px; outline: none; font-size: 12px; font-weight: 600; padding: 6px 16px; width: 100px; text-align: center; letter-spacing: .5px; transition: all .2s ease; cursor: pointer; }
    .category-tag:focus { background: #fff; color: #0f172a; border-color: #0f172a; cursor: text; }

    .toolbar { display: flex; gap: 15px; font-size: 15px; color: #555; padding-bottom: 10px; margin-bottom: 20px; font-weight: bold; align-items: center; }
    .toolbar span { cursor: pointer; user-select: none; }
    .toolbar span:hover { color: #000; }
    .editor-container { min-height: 400px; outline: none; font-size: 16px; line-height: 1.6; padding-bottom: 20px; word-break: break-word; }
    .editor-container img, .row-body img { max-width: 100%; border-radius: 12px; }
    .editor-container blockquote { margin: 8px 0; padding-left: 12px; border-left: 2px solid #ccc; color: #777; }
    .footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #eee; padding-top: 20px; }
    #statusMsg { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }
    .foot-left { display: flex; align-items: center; gap: 15px; }
    .link-del { display: none; background: none; border: none; color: #bbb; font-size: 12px; letter-spacing: 1px; cursor: pointer; }
    .link-del:hover { color: #ff4d4f; }

    .search { width: 100%; box-sizing: border-box; border: none; background: #f3f3f4; border-radius: 12px; padding: 10px 16px; font-size: 14px; outline: none; margin-bottom: 14px; }
    .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px; scrollbar-width: none; }
    .chip { flex: none; border: 1px solid #ddd; background: #fff; color: #888; border-radius: 20px; padding: 5px 14px; font-size: 12px; cursor: pointer; }
    .chip.on { background: #0f172a; border-color: #0f172a; color: #fff; }
    .chip.ghost { border-color: transparent; background: none; color: #bbb; letter-spacing: 1px; }
    .chip a { margin-left: 8px; opacity: .55; cursor: pointer; }
    .chip a:hover { opacity: 1; }
    #catMenu { display: none; position: absolute; top: 100%; left: 0; margin-top: 8px; min-width: 100%; background: #fff; border: 1px solid #e6e6e6; border-radius: 16px; padding: 6px; z-index: 5; box-sizing: border-box; }
    #catMenu.on { display: block; }
    .cm { padding: 7px 14px; border-radius: 10px; font-size: 13px; color: #555; cursor: pointer; white-space: nowrap; }
    .cm:hover { background: #f3f3f4; }
    .cm.on { color: #0f172a; font-weight: 600; }
    .cm-hint { padding: 6px 14px 4px; font-size: 11px; color: #bbb; }
    .editor-container img { cursor: pointer; }
    .editor-container img.sel { outline: 2px solid #0f172a; outline-offset: 2px; }
    #imgBar { display: none; position: fixed; z-index: 9; background: #fff; border: 1px solid #e6e6e6; border-radius: 20px; padding: 4px 6px; font-size: 12px; }
    #imgBar span { padding: 4px 10px; border-radius: 14px; cursor: pointer; color: #555; user-select: none; }
    #imgBar span:hover { background: #f3f3f4; color: #000; }
    .group { font-size: 12px; color: #aaa; letter-spacing: 1px; margin: 22px 0 6px; }
    .list { border-radius: 14px; background: #f7f7f8; overflow: hidden; }
    .row { display: flex; gap: 12px; align-items: center; padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #ececee; margin-left: 0; }
    .row:last-child { border-bottom: none; }
    .row:hover { background: #f0f0f2; }
    .row-main { flex: 1; min-width: 0; }
    .row-title { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row-sub { font-size: 13px; color: #999; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row-sub b { font-weight: 500; color: #666; margin-right: 8px; }
    .row-sub i { font-style: normal; margin-left: 8px; color: #0f172a; font-size: 11px; }
    .thumb { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; flex: none; }
    .empty { text-align: center; color: #bbb; font-size: 13px; padding: 60px 0; letter-spacing: 1px; }
  </style>
</head>
<body>
<div class="frame">

  <div id="loginView">
    <div class="title-logo">PRIVATE LOG</div>
    <button id="googleLoginBtn" class="btn-black">GOOGLE LOGIN</button>
    <div id="loginError" style="color: #ff4d4f; font-size: 12px; margin-top: 10px;"></div>
  </div>

  <div id="mainView">
    <div class="header">
      <button class="btn" id="logoutBtn">LOGOUT</button>
      <div class="category-wrapper" id="catWrap" style="display:none">
        <span class="category-label">CATEGORY</span>
        <span style="position:relative"><input type="text" id="categoryInput" class="category-tag" placeholder="Normal" value="Normal" maxlength="14" autocomplete="off"><div id="catMenu"></div></span>
      </div>
    </div>

    <!-- 목록 화면 -->
    <div id="listScreen" class="screen on">
      <input class="search" id="searchInput" placeholder="Search">
      <div class="chips" id="chips"></div>
      <div id="listBox"></div>
      <div class="footer" style="margin-top:30px">
        <span id="countMsg" style="font-size:12px;color:#aaa;letter-spacing:1px"></span>
        <button id="newBtn" class="btn-black">NEW</button>
      </div>
    </div>

    <!-- 작성 화면 -->
    <div id="editScreen" class="screen">
      <div class="toolbar">
        <span data-cmd="bold">B</span> 
        <span data-cmd="underline">U</span> 
        <span data-cmd="strikeThrough" style="text-decoration: line-through;">S</span> 
        <span data-cmd="insertUnorderedList">≡</span> 
        <span data-cmd="quote">"</span> 
        <span data-cmd="link">🔗</span> 
        <span data-cmd="photo" title="사진 업로드">📷</span>
        <input type="file" id="filePick" accept="image/*" style="display:none;">
      </div>
      <div id="editor" class="editor-container" contenteditable="true"></div>
      <div class="footer">
        <div class="foot-left">
          <button id="backBtn" class="btn">BACK</button>
          <span id="statusMsg"></span>
          <button id="delBtn" class="link-del">DELETE</button>
        </div>
        <button id="doneBtn" class="btn-black">DONE</button>
      </div>
    </div>
  </div>

</div>
<div id="imgBar"><span data-w="25">S</span><span data-w="50">M</span><span data-w="75">L</span><span data-w="100">Full</span><span data-w="x">×</span></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, updateDoc, deleteDoc, setDoc, writeBatch, doc, query, orderBy, limit, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const ADMIN_EMAIL = "raizn199x@gmail.com";

    const firebaseConfig = {
      apiKey: "AIzaSyDWYC-g2LwKA10RUXYB2_5vXNULAcbUVFo",
      authDomain: "memo-9d3d7.firebaseapp.com",
      projectId: "memo-9d3d7",
      storageBucket: "memo-9d3d7.firebasestorage.app",
      messagingSenderId: "648840817270",
      appId: "1:648840817270:web:230131f24b1c311c41cd57",
      measurementId: "G-JFYQHSE5MJ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });

    const $ = (id) => document.getElementById(id);
    const loginView = $('loginView'), mainView = $('mainView'), loginError =$('loginError');
    const statusMsg = $('statusMsg'), doneBtn =$('doneBtn'), editor = $('editor'), categoryInput =$('categoryInput');
    const listScreen = $('listScreen'), editScreen = $('editScreen'), catWrap =$('catWrap');

    let saved = null, allLabel = "All", manage = false, memos = [], filter = "All", editingId = null, unsub = null;
    const DEFAULT_CATS = ["Normal", "Idea", "Log"];

    setPersistence(auth, browserLocalPersistence);

    $('googleLoginBtn').addEventListener('click', async () => {
      try { await signInWithPopup(auth, provider); }
      catch (error) { loginError.innerText = "Login failed: " + error.message; }
    });
    $('logoutBtn').addEventListener('click', () => signOut(auth));

    onAuthStateChanged(auth, (user) => {
      if (user) {
        if (user.email === ADMIN_EMAIL) {
          loginView.style.display = "none";
          mainView.style.display = "block";
          loginError.innerText = "";
          startListening();
        } else {
          signOut(auth);
          loginError.innerText = "This account has no access.";
        }
      } else {
        if (unsub) { unsub(); unsub = null; }
        memos = [];
        loginView.style.display = "flex";
        mainView.style.display = "none";
      }
    });

    function startListening() {
      if (unsub) return;
      // 목록 첫 화면 최신 7개만 불러오도록 limit(7) 적용
      const q = query(collection(db, "memos"), orderBy("createdAt", "desc"), limit(7));
      onSnapshot(doc(db, "settings", "categories"), (s) => { saved = s.exists() ? s.data().list : null; allLabel = (s.exists() && s.data().allLabel) || "All"; render(); }, () => {});
      unsub = onSnapshot(q, (snap) => {
        memos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        render();
      }, (e) => { $('listBox').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; });
    }

    const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const cats = () => [...new Set([...(saved || DEFAULT_CATS), ...memos.map(m => m.category).filter(Boolean)])];
    const toText = (html) => { const d = document.createElement('div'); d.innerHTML = html; return (d.textContent || "").trim(); };
    const firstImg = (html) => { const d = document.createElement('div'); d.innerHTML = html; const i = d.querySelector('img'); return i ? i.src : null; };

    function groupLabel(ts) {
      if (!ts) return "Just now";
      const d = ts.toDate(), now = new Date(), day = 864e5;
      const diff = (new Date(now.getFullYear(), now.getMonth(), now.getDate()) - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / day;
      if (diff <= 0) return "Today";
      if (diff <= 7) return "Previous 7 Days";
      if (diff <= 30) return "Previous 30 Days";
      return d.toLocaleString("en-US", { month: "long", year: "numeric" });
    }
    function shortDate(ts) {
      if (!ts) return "";
      const d = ts.toDate();
      return (d.getMonth() + 1) + "/" + d.getDate() + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
    }

    function render() {
      $('chips').innerHTML = ["All", ...cats()].map(c => manage
        ? `<span class="chip">${esc(c === "All" ? allLabel : c)}<a data-a="${c === "All" ? "renall" : "ren"}" data-c="${esc(c)}">✎</a>${c === "All" ? "" : `<a data-a="del" data-c="${esc(c)}">×</a>`}</span>`
        : `<button class="chip ${c === filter ? 'on' : ''}" data-c="${esc(c)}">${esc(c === "All" ? allLabel : c)}</button>`).join("")
        + (manage ? `<button class="chip" data-a="add">+</button>` : "") + `<button class="chip ghost" data-a="toggle">${manage ? "DONE" : "EDIT"}</button>`;
      $('catMenu').innerHTML = cats().map(c => `<div class="cm ${c === categoryInput.value.trim() ? 'on' : ''}" data-c="${esc(c)}">${esc(c)}</div>`).join("") + '<div class="cm-hint">Type to create new</div>';
      const kw = $('searchInput').value.trim().toLowerCase();
      const list = memos.filter(m => (filter === "All" || m.category === filter) && (!kw || toText(m.content || "").toLowerCase().includes(kw)));
      $('countMsg').innerText = list.length + " NOTES";
      if (!list.length) { $('listBox').innerHTML = '<div class="empty">' + (kw ? "No results" : "Nothing here yet") + '</div>'; return; }
      let html = "", last = "", open = false;
      for (const m of list) {
        const g = groupLabel(m.createdAt);
        if (g !== last) { if (open) html += "</div>"; html += `<div class="group">${esc(g)}</div><div class="list">`; last = g; open = true; }
        const text = toText(m.content || "");
        const lines = text.split(/\n|\s{2,}/).filter(Boolean);
        const title = lines[0] || "(Image)";
        const img = firstImg(m.content || "");
        html += `<div class="row" data-id="${m.id}"><div class="row-main"><div class="row-title">${esc(title.slice(0, 60))}</div><div class="row-sub"><b>${esc(shortDate(m.createdAt))}</b>${esc((lines[1] || text.slice(title.length)).slice(0, 60))}<i>${esc(m.category || "")}</i></div></div>${img ? `<img class="thumb" src="${esc(img)}">` : ""}</div>`;
      }
      $('listBox').innerHTML = html + "</div>";
    }

    const saveCats = (list, label = allLabel) => setDoc(doc(db, "settings", "categories"), { list, allLabel: label }).catch(e => alert("Save failed: " + e.message));
    async function moveMemos(from, to) {
      const hit = memos.filter(m => m.category === from);
      for (let i = 0; i < hit.length; i += 400) {
        const b = writeBatch(db);
        hit.slice(i, i + 400).forEach(m => b.update(doc(db, "memos", m.id), { category: to }));
        await b.commit();
      }
    }
    $('chips').addEventListener('click', async (e) => {
      const el = e.target.closest('[data-a], .chip'); if (!el) return;
      const a = el.dataset.a, c = el.dataset.c;
      if (a === "toggle") { manage = !manage; return render(); }
      if (a === "add") {
        const n = (prompt("New category name") || "").trim().slice(0, 14);
        if (n && !cats().includes(n)) await saveCats([...cats(), n]);
        return;
      }
      if (a === "renall") {
        const n = (prompt("Rename", allLabel) || "").trim().slice(0, 14);
        if (n) await saveCats(cats(), n);
        return;
      }
      if (a === "ren") {
        const n = (prompt("Rename category", c) || "").trim().slice(0, 14);
        if (!n || n === c || cats().includes(n)) return;
        try { await moveMemos(c, n); await saveCats(cats().map(x => x === c ? n : x)); if (filter === c) filter = n; } catch (err) { alert(err.message); }
        return;
      }
      if (a === "del") {
        const to = cats().find(x => x !== c);
        if (!to) return alert("Keep at least one category.");
        if (!confirm(`Delete "${c}"?\nIts notes will move to ${to}.`)) return;
        try { await moveMemos(c, to); await saveCats(cats().filter(x => x !== c)); if (filter === c) filter = "All"; } catch (err) { alert(err.message); }
        return;
      }
      if (c) { filter = c; render(); }
    });
    $('searchInput').addEventListener('input', render);$('listBox').addEventListener('click', (e) => {
      const r = e.target.closest('.row'); if (!r) return;
      openEditor(memos.find(m => m.id === r.dataset.id));
    });
    categoryInput.addEventListener('focus', () => { categoryInput.select(); render(); $('catMenu').classList.add('on'); });
    categoryInput.addEventListener('blur', () => $('catMenu').classList.remove('on'));
    categoryInput.addEventListener('input', render);
    $('catMenu').addEventListener('mousedown', (e) => {
      e.preventDefault();
      const c = e.target.closest('.cm'); if (!c) return;
      categoryInput.value = c.dataset.c; categoryInput.blur();
    });
    $('newBtn').addEventListener('click', () => openEditor(null));$('backBtn').addEventListener('click', showList);

    function showList() {
      editScreen.classList.remove('on'); listScreen.classList.add('on'); catWrap.style.display = "none"; editingId = null;
    }
    function openEditor(m) {
      editingId = m ? m.id : null;
      editor.innerHTML = m ? m.content : "";
      categoryInput.value = m ? (m.category || cats()[0]) : (filter !== "All" ? filter : cats()[0] || "Normal");
      $('delBtn').style.display = m ? "inline" : "none";
      listScreen.classList.remove('on'); editScreen.classList.add('on'); catWrap.style.display = "flex";
      if (!m) editor.focus();
    }

    /* 툴바 이벤트 */
    $('editScreen').querySelector('.toolbar').addEventListener('mousedown', (e) => {
      const s = e.target.closest('span[data-cmd]'); if (!s) return;
      e.preventDefault();
      const cmd = s.dataset.cmd;
      editor.focus();

      if (cmd === 'photo') {
        $('filePick').click();
      } else if (cmd === 'quote') {
        document.execCommand('formatBlock', false, 'blockquote');
      } else if (cmd === 'link') {
        const url = prompt("Link URL");
        if (url) document.execCommand('createLink', false, url.startsWith('http') ? url : 'https://' + url);
      } else {
        document.execCommand(cmd);
      }
    });

    let selImg = null;
    const hideBar = () => { $('imgBar').style.display = "none"; if (selImg) selImg.classList.remove('sel'); selImg = null; };
    editor.addEventListener('click', (e) => {
      hideBar();
      if (e.target.tagName !== "IMG") return;
      selImg = e.target; selImg.classList.add('sel');
      const r = selImg.getBoundingClientRect(), bar = $('imgBar');
      bar.style.display = "block"; bar.style.left = Math.max(8, r.left) + "px"; bar.style.top = (r.bottom + 8) + "px";
    });
    $('imgBar').addEventListener('mousedown', (e) => {
      e.preventDefault();
      const w = e.target.dataset.w; if (!w || !selImg) return;
      if (w === "x") selImg.remove(); else selImg.style.width = w + "%";
      hideBar();
    });
    window.addEventListener('scroll', hideBar, true);
    window.addEventListener('resize', hideBar);

    /* 파일 선택 및 붙여넣기(Ctrl+V) 처리 */
    $('filePick').addEventListener('change', (e) => { 
      const f = e.target.files[0]; 
      e.target.value = ""; 
      if (f) insertPhoto(f); 
    });

    editor.addEventListener('paste', (e) => {
      const items = e.clipboardData?.items || [];
      for (const item of items) {
        if (item.type.indexOf('image') !== -1) {
          e.preventDefault();
          const file = item.getAsFile();
          if (file) insertPhoto(file);
          break;
        }
      }
    });

    /* Base64 자동 압축 및 에디터 직접 삽입 */
    function insertPhoto(file) {
      statusMsg.innerText = "PROCESSING...";
      statusMsg.style.color = "#888";

      const img = new Image();
      const url = URL.createObjectURL(file);

      img.onload = () => {
        const max = 1000;
        let w = img.width, h = img.height;
        if (w > max || h > max) {
          if (w > h) { h = Math.round((h * max) / w); w = max; }
          else { w = Math.round((w * max) / h); h = max; }
        }

        const c = document.createElement('canvas');
        c.width = w;
        c.height = h;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);

        const dataUrl = c.toDataURL('image/jpeg', 0.7);

        editor.focus();
        document.execCommand('insertImage', false, dataUrl);
        statusMsg.innerText = "SUCCESS";
        statusMsg.style.color = "#0f172a";
        setTimeout(() => { statusMsg.innerText = ""; }, 1200);
      };

      img.onerror = () => {
        alert("이미지 파일을 읽을 수 없습니다.");
        statusMsg.innerText = "ERROR";
        statusMsg.style.color = "#ff4d4f";
      };

      img.src = url;
    }

    doneBtn.addEventListener('click', async () => {
      hideBar();
      const content = editor.innerHTML.trim();
      const category = categoryInput.value.trim() || cats()[0] || "Normal";
      const flash = (t, c) => { statusMsg.innerText = t; statusMsg.style.color = c; };
      if (!toText(content) && !editor.querySelector('img')) return flash("EMPTY", "#ff4d4f");
      if (content.length > 950000) return flash("TOO LARGE", "#ff4d4f");
      try {
        flash("SAVING...", "#888");
        doneBtn.disabled = true;
        if (editingId) await updateDoc(doc(db, "memos", editingId), { category, content, updatedAt: serverTimestamp() });
        else await addDoc(collection(db, "memos"), { category, content, createdAt: serverTimestamp() });
        flash("SAVED", "#0f172a");
        editor.innerHTML = "";
        showList();
      } catch (e) {
        flash("ERROR: " + e.message, "#ff4d4f");
      } finally {
        doneBtn.disabled = false;
        setTimeout(() => { statusMsg.innerText = ""; }, 2000);
      }
    });

    $('delBtn').addEventListener('click', async () => {
      if (!editingId || !confirm("Delete this note?")) return;
      try { await deleteDoc(doc(db, "memos", editingId)); showList(); }
      catch (e) { statusMsg.innerText = "ERROR: " + e.message; statusMsg.style.color = "#ff4d4f"; }
    });
  </script>
</body>
</html>
