<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEMO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
  <style>
    /* 미니멀 에디터 커스텀 */
    .ql-toolbar.ql-snow {
      border: none !important;
      border-bottom: 1px solid #f1f5f9 !important;
      padding: 8px 0 !important;
    }
    .ql-container.ql-snow {
      border: none !important;
      font-size: 15px;
      min-height: 400px;
    }
    .ql-editor {
      padding: 16px 0 !important;
    }
    .ql-editor.ql-blank::before {
      color: #cbd5e1;
      font-style: normal;
      left: 0 !important;
    }
    .btn-pill {
      transition: all 0.15s ease-in-out;
    }
  </style>
</head>
<body class="bg-white min-h-screen flex items-center justify-center text-slate-900 antialiased font-sans">

  <!-- 1. LOGIN VIEW (투박한 타이틀/테두리 박스 전면 제거, 밑줄형 라인 인풋) -->
  <div id="loginView" class="w-full max-w-[280px] p-4 space-y-6">
    <div class="space-y-4">
      <div>
        <input type="email" id="emailInput" placeholder="EMAIL" class="w-full py-2.5 bg-transparent border-b border-gray-200 text-xs tracking-widest placeholder:text-gray-300 focus:outline-none focus:border-black transition">
      </div>
      <div>
        <input type="password" id="passwordInput" placeholder="PASSWORD" class="w-full py-2.5 bg-transparent border-b border-gray-200 text-xs tracking-widest placeholder:text-gray-300 focus:outline-none focus:border-black transition">
      </div>
      <button id="loginBtn" class="w-full py-3 mt-3 bg-black hover:bg-slate-900 text-white rounded-full text-xs tracking-widest font-mono transition active:scale-95">ENTER</button>
    </div>
    <p id="loginError" class="text-[11px] text-red-500 text-center min-h-[16px] font-mono"></p>
  </div>

  <!-- 2. MAIN MEMO VIEW -->
  <div id="mainView" class="hidden w-full max-w-2xl p-6 space-y-4">
    
    <!-- HEADER (타원형 토글 버튼 & 우측 LOGOUT) -->
    <div class="flex justify-between items-center pb-3 border-b border-gray-100">
      <div class="flex gap-2">
        <button id="editBtn" class="btn-pill px-4 py-1.5 rounded-full border border-gray-200 text-xs text-gray-500 hover:border-gray-400 focus:outline-none">수정</button>
        <button id="categoryBtn" class="btn-pill px-4 py-1.5 rounded-full border border-gray-200 text-xs text-gray-500 hover:border-gray-400 focus:outline-none">분류</button>
      </div>
      <button id="logoutBtn" type="button" class="text-[11px] text-gray-300 hover:text-black tracking-wider transition font-mono">
        LOGOUT
      </button>
    </div>

    <!-- WYSIWYG EDITOR -->
    <div id="editor"></div>

    <!-- ACTION BAR -->
    <div class="flex justify-between items-center pt-3 border-t border-gray-100">
      <span id="statusText" class="text-xs text-gray-400 font-mono"></span>
      <button id="saveBtn" type="button" class="px-5 py-2 bg-black hover:bg-slate-900 text-white font-medium text-xs rounded-full transition disabled:bg-gray-200">
        저장
      </button>
    </div>
  </div>

  <!-- FIREBASE & LOGIC -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAagWKtXuvQOhV-__Mxmd5ys8vs0xDDCUs",
      authDomain: "water-log132.firebaseapp.com",
      projectId: "water-log132",
      storageBucket: "water-log132.firebasestorage.app",
      messagingSenderId: "569667354916",
      appId: "1:569667354916:web:6cc37173ed1c9c2cf7f3b1",
      measurementId: "G-2L6JGTPD41"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // 한 번 로그인하면 세션 영구 유지 (다시는 로그인 창 안 뜸)
    setPersistence(auth, browserLocalPersistence).catch(console.error);

    // Quill 에디터
    const quill = new Quill('#editor', {
      theme: 'snow',
      placeholder: '내용을 입력하세요...',
      modules: {
        toolbar: [
          [{ 'header': [1, 2, false] }],
          ['bold', 'underline', 'strike'],
          [{ 'list': 'ordered'}, { 'list': 'bullet' }],
          ['blockquote', 'link'],
          ['clean']
        ]
      }
    });

    const loginView = document.getElementById('loginView');
    const mainView = document.getElementById('mainView');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const loginError = document.getElementById('loginError');

    // 타원형 버튼 클릭 시 색상 토글 (네이비/블랙 계열)
    const setupToggleBtn = (id) => {
      const btn = document.getElementById(id);
      btn.addEventListener('click', () => {
        btn.classList.toggle('bg-slate-900');
        btn.classList.toggle('text-white');
        btn.classList.toggle('border-slate-900');
        btn.classList.toggle('text-gray-500');
        btn.classList.toggle('border-gray-200');
      });
    };
    setupToggleBtn('editBtn');
    setupToggleBtn('categoryBtn');

    // 로그인 상태 감지
    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginView.classList.add('hidden');
        mainView.classList.remove('hidden');
      } else {
        mainView.classList.add('hidden');
        loginView.classList.remove('hidden');
      }
    });

    // 로그인 실행
    loginBtn.addEventListener('click', async () => {
      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passwordInput').value.trim();
      loginError.innerText = '';

      if (!email || !password) {
        loginError.innerText = 'Required.';
        return;
      }

      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        console.error("Login failed:", err);
        loginError.innerText = 'Auth failed.';
      }
    });

    // 비밀번호 입력 후 엔터 누르면 자동 진행
    document.getElementById('passwordInput').addEventListener('keyup', (e) => {
      if (e.key === 'Enter') loginBtn.click();
    });

    // 로그아웃
    logoutBtn.addEventListener('click', async () => {
      try {
        await signOut(auth);
      } catch (err) {
        console.error('Logout error:', err);
      }
    });

    // 메모 저장
    const saveBtn = document.getElementById('saveBtn');
    const statusText = document.getElementById('statusText');

    saveBtn.addEventListener('click', async () => {
      const htmlContent = quill.root.innerHTML;
      const textContent = quill.getText().trim();

      if (!textContent) {
        statusText.innerText = '내용 없음';
        return;
      }

      saveBtn.disabled = true;
      statusText.innerText = '저장 중...';

      try {
        await addDoc(collection(db, "memos"), {
          content: htmlContent,
          rawText: textContent,
          createdAt: serverTimestamp()
        });

        quill.setText('');
        statusText.innerText = '저장 완료';
        setTimeout(() => { statusText.innerText = ''; }, 2000);
      } catch (err) {
        console.error('Firestore save error:', err);
        statusText.innerText = '저장 에러';
      } finally {
        saveBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
