<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEMO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
  <style>
    /* 미니멀 iOS 모노톤 에디터 */
    .ql-toolbar.ql-snow {
      border: none !important;
      border-bottom: 1px solid #f1f5f9 !important;
      padding: 8px 0 !important;
    }
    .ql-container.ql-snow {
      border: none !important;
      font-size: 15px;
      min-height: 400px;
    }
    .ql-editor {
      padding: 16px 0 !important;
    }
    .ql-editor.ql-blank::before {
      color: #cbd5e1;
      font-style: normal;
      left: 0 !important;
    }
    .btn-pill {
      transition: all 0.15s ease-in-out;
    }
  </style>
</head>
<body class="bg-white min-h-screen flex items-center justify-center text-slate-900 antialiased font-sans p-4">

  <!-- MAIN MEMO VIEW (접속하자마자 바로 노출) -->
  <div id="mainView" class="w-full max-w-2xl space-y-4">
    
    <!-- HEADER -->
    <div class="flex justify-between items-center pb-3 border-b border-gray-100">
      <div class="flex gap-2">
        <button id="editBtn" class="btn-pill px-4 py-1.5 rounded-full border border-gray-200 text-xs text-gray-500 hover:border-gray-400 focus:outline-none">EDIT</button>
        <!-- 팝업 대신 인라인 입력 필드로 변경 -->
        <input type="text" id="categoryInput" value="CATEGORY" class="btn-pill w-28 px-4 py-1.5 rounded-full border border-gray-200 text-xs text-center text-gray-500 hover:border-gray-400 focus:outline-none focus:border-slate-900 focus:text-slate-900 bg-transparent">
      </div>
      <span class="text-[10px] text-gray-300 font-mono tracking-widest">LOG</span>
    </div>

    <!-- WYSIWYG EDITOR -->
    <div id="editor"></div>

    <!-- ACTION BAR -->
    <div class="flex justify-between items-center pt-3 border-t border-gray-100">
      <span id="statusText" class="text-xs text-gray-400 font-mono tracking-wider"></span>
      <button id="saveBtn" type="button" class="px-6 py-2 bg-black hover:bg-slate-900 text-white font-bold text-xs rounded-full tracking-widest transition disabled:bg-gray-200">
        DONE
      </button>
    </div>
  </div>

  <!-- FIREBASE & LOGIC (로그인 로직 완전 제거) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAagWKtXuvQOhV-__Mxmd5ys8vs0xDDCUs",
      authDomain: "water-log132.firebaseapp.com",
      projectId: "water-log132",
      storageBucket: "water-log132.firebasestorage.app",
      messagingSenderId: "569667354916",
      appId: "1:569667354916:web:6cc37173ed1c9c2cf7f3b1",
      measurementId: "G-2L6JGTPD41"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Quill 에디터 초기화
    const quill = new Quill('#editor', {
      theme: 'snow',
      placeholder: '기록을 남기세요...',
      modules: {
        toolbar: [
          [{ 'header': [1, 2, false] }],
          ['bold', 'underline', 'strike'],
          [{ 'list': 'ordered'}, { 'list': 'bullet' }],
          ['blockquote', 'link'],
          ['clean']
        ]
      }
    });

    const categoryInput = document.getElementById('categoryInput');

    // 페이지 로드 시 바로 마지막 메모 불러오기
    async function loadLastMemo() {
      try {
        const q = query(collection(db, "memos"), orderBy("createdAt", "desc"), limit(1));
        const snap = await getDocs(q);
        snap.forEach((doc) => {
          const data = doc.data();
          quill.root.innerHTML = data.content;
          
          if (data.category && data.category !== 'CATEGORY') {
            categoryInput.value = data.category;
            categoryInput.classList.add('border-slate-900', 'text-slate-900');
            categoryInput.classList.remove('border-gray-200', 'text-gray-500');
          }
        });
      } catch (err) {
        console.error("기존 데이터를 불러오지 못했습니다.", err);
      }
    }

    loadLastMemo();

    // EDIT 버튼 토글 기능
    const editBtn = document.getElementById('editBtn');
    editBtn.addEventListener('click', () => {
      editBtn.classList.toggle('bg-slate-900');
      editBtn.classList.toggle('text-white');
      editBtn.classList.toggle('border-slate-900');
      editBtn.classList.toggle('text-gray-500');
      editBtn.classList.toggle('border-gray-200');
    });

    // DONE 버튼 저장 기능
    const saveBtn = document.getElementById('saveBtn');
    const statusText = document.getElementById('statusText');

    saveBtn.addEventListener('click', async () => {
      const htmlContent = quill.root.innerHTML;
      const textContent = quill.getText().trim();
      const currentCategory = categoryInput.value || 'CATEGORY';

      if (!textContent) {
        statusText.innerText = 'EMPTY';
        return;
      }

      saveBtn.disabled = true;
      statusText.innerText = 'SAVING...';

      try {
        await addDoc(collection(db, "memos"), {
          content: htmlContent,
          rawText: textContent,
          category: currentCategory,
          createdAt: serverTimestamp()
        });

        statusText.innerText = 'SAVED';
        setTimeout(() => { statusText.innerText = ''; }, 2000);
      } catch (err) {
        console.error('Firestore save error:', err);
        statusText.innerText = 'ERROR';
      } finally {
        saveBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
