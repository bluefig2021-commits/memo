<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>메모</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ffffff;
    --ink:#161616;
    --mute:#9a9a9a;
    --rule:#ececec;
    --accent:#4a4bf0;   /* clean signal-violet, used sparingly */
    --danger:#e0432b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font:16px/1.65 'Pretendard',-apple-system,"Apple SD Gothic Neo",sans-serif;
    padding:max(28px,env(safe-area-inset-top)) 22px max(48px,env(safe-area-inset-bottom));
  }
  main{max-width:560px;margin:0 auto}

  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:36px}
  .wordmark{font-weight:700;font-size:1.1rem;letter-spacing:-.02em;color:var(--ink)}
  .navlinks{display:flex;gap:18px}
  .link{background:none;border:0;padding:2px 0;font:500 .85rem/1 'Pretendard',sans-serif;color:var(--mute);cursor:pointer;border-bottom:1px solid transparent}
  .link:hover{color:var(--ink);border-color:var(--mute)}

  /* ---- login ---- */
  #login{display:none;padding:16vh 0 0;text-align:center}
  #login .wordmark{display:block;font-size:1.6rem;margin-bottom:10px}
  #login p{color:var(--mute);font-size:.92rem;margin:0 0 34px}
  .g-btn{
    display:inline-flex;align-items:center;gap:10px;background:var(--accent);color:#fff;
    border:0;padding:13px 22px;font:600 .95rem/1 'Pretendard',sans-serif;cursor:pointer;
  }
  .g-btn:hover{background:#3d3edb}
  #loginMsg{margin-top:16px;font-size:.85rem;color:var(--danger)}

  /* ---- composer ---- */
  #app{display:none}
  .composer{margin-bottom:8px}
  textarea{
    width:100%;min-height:132px;resize:vertical;border:0;background:transparent;
    font:400 1.05rem/1.7 'Pretendard',sans-serif;color:var(--ink);outline:none;
    border-bottom:1px solid var(--rule);padding-bottom:14px;
  }
  textarea::placeholder{color:#c3bdad}
  textarea:focus{border-color:var(--ink)}
  .composer-row{display:flex;align-items:center;gap:14px;margin-top:12px}
  .tagfield{
    flex:1;border:0;border-bottom:1px solid var(--rule);background:transparent;
    font:400 .88rem/1.4 'Pretendard',sans-serif;color:var(--ink);padding:6px 0;outline:none;
  }
  .tagfield::placeholder{color:#c3bdad}
  .tagfield:focus{border-color:var(--ink)}
  .btn{border:0;background:none;cursor:pointer;font:500 .88rem/1 'Pretendard',sans-serif;white-space:nowrap}
  .btn.ai{color:var(--mute)}
  .btn.ai:hover{color:var(--ink)}
  .btn.save{background:var(--accent);color:#fff;padding:10px 20px}
  .btn.save:hover{background:#2b3350}
  .btn.save:disabled{opacity:.4;cursor:default}
  .btn.cancel{color:var(--mute)}
  #msg{min-height:1.3em;font-size:.82rem;color:var(--mute);margin:10px 0 0}
  #msg.err{color:var(--danger)}

  /* ---- filters ---- */
  .filters{display:flex;gap:16px;align-items:center;margin:44px 0 14px;flex-wrap:wrap}
  .filters input[type=search]{
    flex:1;min-width:140px;border:0;border-bottom:1px solid var(--rule);background:transparent;
    font:400 .9rem 'Pretendard',sans-serif;padding:6px 0;outline:none;color:var(--ink);
  }
  .filters input[type=search]:focus{border-color:var(--ink)}
  select{
    border:0;border-bottom:1px solid var(--rule);background:transparent;
    font:400 .85rem 'Pretendard',sans-serif;color:var(--mute);padding:6px 4px 6px 0;
  }
  .tags{display:flex;flex-wrap:wrap;gap:8px 14px;margin:16px 0 6px}
  .chip{background:none;border:0;padding:0;font:400 .85rem 'Pretendard',sans-serif;color:var(--mute);cursor:pointer;border-bottom:1px solid transparent}
  .chip:hover{color:var(--ink)}
  .chip.on{color:var(--accent);border-color:var(--accent)}
  .count{font-size:.78rem;color:var(--mute);margin:18px 0 0}

  /* ---- notes ---- */
  .note{border-top:1px solid var(--rule);padding:22px 0}
  .note .date{font-size:.78rem;color:var(--mute);letter-spacing:.02em}
  .note .body{white-space:pre-wrap;word-break:break-word;margin:8px 0 10px;font-size:1rem}
  .note .nt{font-size:.85rem;color:var(--accent)}
  .note .acts{margin-top:8px;display:flex;gap:16px}
  .note .acts .link{font-size:.8rem}
  .empty{color:var(--mute);font-size:.92rem;padding:30px 0 0}

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#131313;--ink:#f0f0ee;--mute:#7c7c7c;--rule:#2a2a2a;--accent:#8b8bff;--danger:#ff7a5c;
    }
    .btn.save{color:#0d0d0d}
  }
</style>
</head>
<body>
<main>

<section id="login">
  <span class="wordmark">메모</span>
  <p>구글 계정으로 로그인하면 내 글만 안전하게 저장돼요.</p>
  <button class="g-btn" id="inBtn">Google로 계속하기</button>
  <p id="loginMsg"></p>
</section>

<div id="app">
  <header>
    <span class="wordmark">메모</span>
    <div class="navlinks">
      <button class="link" id="exportBtn">백업</button>
      <button class="link" id="outBtn">로그아웃</button>
    </div>
  </header>

  <section class="composer">
    <textarea id="text" placeholder="지금 생각을 적어두세요"></textarea>
    <div class="composer-row">
      <input class="tagfield" id="tagIn" placeholder="태그 · 예) 영감 헛소리">
      <button class="btn ai" id="aiBtn">태그 제안</button>
      <button class="btn cancel" id="cancelBtn" style="display:none">취소</button>
      <button class="btn save" id="saveBtn">저장</button>
    </div>
    <p id="msg"></p>
  </section>

  <section class="filters">
    <input id="q" type="search" placeholder="검색">
    <select id="year"></select>
    <select id="month"></select>
  </section>
  <div class="tags" id="tags"></div>
  <div class="count" id="count"></div>
  <div id="list"></div>
</div>

</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

// ▼ Firebase 콘솔 → 프로젝트 설정 → 내 앱(웹)에서 복사한 값으로 바꾸세요
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  appId: "YOUR_APP_ID"
};
// ▲

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const setMsg = (t, err) => { const m = $('#msg'); m.textContent = t; m.className = err ? 'err' : ''; };

if (firebaseConfig.projectId === "YOUR_PROJECT_ID") {
  $('#login').style.display = 'block';
  $('#inBtn').style.display = 'none';
  $('#loginMsg').textContent = '파일 안의 firebaseConfig를 Firebase 콘솔 값으로 바꿔주세요.';
  throw new Error('firebaseConfig not set');
}

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
let notesCol = null, unsub = null;
let notes = [], editId = null, f = { y: '', m: '', t: '', q: '' };

// ── 로그인 ──
$('#inBtn').onclick = async () => {
  const p = new GoogleAuthProvider();
  try { await signInWithPopup(auth, p); }
  catch (e) {
    if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') return signInWithRedirect(auth, p);
    $('#loginMsg').textContent = e.code === 'auth/unauthorized-domain'
      ? '이 주소가 Firebase의 승인된 도메인에 없어요. Authentication → 설정 → 승인된 도메인에 추가하세요.'
      : '로그인 실패: ' + (e.code || e.message);
  }
};
$('#outBtn').onclick = () => signOut(auth);

onAuthStateChanged(auth, user => {
  if (unsub) { unsub(); unsub = null; }
  notes = [];
  if (!user) {
    $('#login').style.display = 'block'; $('#app').style.display = 'none';
    return;
  }
  $('#login').style.display = 'none'; $('#app').style.display = 'block';
  notesCol = collection(db, 'users', user.uid, 'notes');
  unsub = onSnapshot(query(notesCol, orderBy('createdAt', 'desc')),
    snap => { notes = snap.docs.map(d => ({ id: d.id, ...d.data() })); render(); },
    err => setMsg('불러오기 실패: Firestore 규칙을 확인하세요 (' + err.code + ')', 1));
});

// ── 목록 ──
const cleanTags = s => [...new Set(s.split(/[\s,#]+/).map(t => t.trim()).filter(Boolean))].slice(0, 8);
const parts = n => { const d = new Date(n.createdAt); return { y: String(d.getFullYear()), m: pad(d.getMonth() + 1), label: `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())}  ${pad(d.getHours())}:${pad(d.getMinutes())}` }; };

function render() {
  const years = [...new Set(notes.map(n => parts(n).y))];
  $('#year').innerHTML = '<option value="">전체 연도</option>' + years.map(y => `<option value="${y}" ${f.y === y ? 'selected' : ''}>${y}년</option>`).join('');
  $('#month').innerHTML = '<option value="">전체 월</option>' + Array.from({ length: 12 }, (_, i) => pad(i + 1)).map(m => `<option value="${m}" ${f.m === m ? 'selected' : ''}>${+m}월</option>`).join('');

  const scoped = notes.filter(n => { const p = parts(n); return (!f.y || p.y === f.y) && (!f.m || p.m === f.m); });
  const counts = {};
  scoped.forEach(n => (n.tags || []).forEach(t => counts[t] = (counts[t] || 0) + 1));
  $('#tags').innerHTML = Object.entries(counts).sort((a, b) => b[1] - a[1])
    .map(([t, c]) => `<button class="chip ${f.t === t ? 'on' : ''}" data-t="${esc(t)}">#${esc(t)} ${c}</button>`).join('');

  const q = f.q.toLowerCase();
  const shown = scoped.filter(n => (!f.t || (n.tags || []).includes(f.t)) &&
    (!q || n.content.toLowerCase().includes(q) || (n.tags || []).some(t => t.toLowerCase().includes(q))));
  $('#count').textContent = notes.length ? `${shown.length}개` : '';
  $('#list').innerHTML = shown.length ? shown.map(n => `
    <article class="note">
      <div class="date">${parts(n).label}</div>
      <div class="body">${esc(n.content)}</div>
      <div class="nt">${(n.tags || []).map(t => '#' + esc(t)).join(' ')}</div>
      <div class="acts"><button class="link" data-edit="${n.id}">수정</button><button class="link" data-del="${n.id}">삭제</button></div>
    </article>`).join('') : `<p class="empty">${notes.length ? '조건에 맞는 글이 없어요' : '아직 글이 없어요. 위에 첫 글을 적어보세요'}</p>`;
}

// ── 저장 / 수정 / 삭제 ──
async function save() {
  const content = $('#text').value.trim();
  if (!content) return setMsg('내용을 입력하세요', 1);
  const btn = $('#saveBtn'); btn.disabled = true; setMsg('저장 중…');
  const tags = cleanTags($('#tagIn').value);
  try {
    if (editId) await updateDoc(doc(notesCol, editId), { content, tags, updatedAt: Date.now() });
    else await addDoc(notesCol, { content, tags, createdAt: Date.now() });
    resetForm(); localStorage.removeItem('draft'); setMsg('저장했어요');
  } catch (e) { setMsg('저장 실패: ' + (e.code || e.message), 1); }   // 글은 입력창에 남음
  btn.disabled = false;
}
function resetForm() { editId = null; $('#text').value = ''; $('#tagIn').value = ''; $('#cancelBtn').style.display = 'none'; $('#saveBtn').textContent = '저장'; }

$('#saveBtn').onclick = save;
$('#cancelBtn').onclick = () => { resetForm(); setMsg(''); };
$('#list').onclick = async e => {
  const ed = e.target.dataset.edit, del = e.target.dataset.del;
  if (ed) {
    const n = notes.find(x => x.id === ed); if (!n) return;
    editId = ed; $('#text').value = n.content; $('#tagIn').value = (n.tags || []).join(' ');
    $('#cancelBtn').style.display = ''; $('#saveBtn').textContent = '수정 저장';
    window.scrollTo({ top: 0 }); $('#text').focus();
  }
  if (del && confirm('이 글을 삭제할까요? 되돌릴 수 없어요.')) {
    try { await deleteDoc(doc(notesCol, del)); } catch (er) { setMsg('삭제 실패: ' + (er.code || er.message), 1); }
  }
};

// ── 필터 ──
$('#year').onchange = e => { f.y = e.target.value; f.t = ''; render(); };
$('#month').onchange = e => { f.m = e.target.value; f.t = ''; render(); };
$('#q').oninput = e => { f.q = e.target.value; render(); };
$('#tags').onclick = e => { const b = e.target.closest('.chip'); if (!b) return; f.t = f.t === b.dataset.t ? '' : b.dataset.t; render(); };

// ── 임시 저장 ──
try { $('#text').value = localStorage.getItem('draft') || ''; } catch {}
$('#text').oninput = e => { if (!editId) try { localStorage.setItem('draft', e.target.value); } catch {} };

// ── 백업(JSON 다운로드) ──
$('#exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(notes, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  const d = new Date(); a.download = `memo-backup-${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}.json`; a.click();
};

// ── AI 태그 추천 (선택) ──
$('#aiBtn').onclick = async () => {
  const text = $('#text').value.trim();
  if (!text) return setMsg('내용을 먼저 입력하세요', 1);
  let key = ''; try { key = localStorage.getItem('gkey') || ''; } catch {}
  if (!key) { key = (prompt('Gemini API 키를 입력하세요 (이 브라우저에만 저장돼요)') || '').trim(); if (!key) return; try { localStorage.setItem('gkey', key); } catch {} }
  setMsg('태그 찾는 중…');
  try {
    const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
      body: JSON.stringify({
        contents: [{ parts: [{ text: '다음 글의 주제·대상·감정을 나타내는 짧은 한국어 태그를 3~5개 뽑아 JSON 문자열 배열로만 답해. 평가나 훈계는 하지 마.\n\n' + text }] }],
        generationConfig: { responseMimeType: 'application/json' }
      })
    });
    if (!r.ok) { if (r.status === 400 || r.status === 403) try { localStorage.removeItem('gkey'); } catch {} throw new Error('태그 제안 실패 (' + r.status + ')'); }
    const arr = JSON.parse((await r.json()).candidates[0].content.parts[0].text);
    $('#tagIn').value = cleanTags(arr.join(' ')).join(' ');
    setMsg('제안한 태그를 넣었어요. 고쳐서 저장하세요');
  } catch (e) { setMsg(e.message || '태그를 가져오지 못했어요', 1); }
};
</script>
</body>
</html>
