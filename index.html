<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MEMO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-body: #f7f7f8;
      --bg-card: #ffffff;
      --border-color: #e9e9ec;
      --text-main: #191919;
      --text-sub: #787878;
      --accent-color: #2383e2; /* 노션 블루 포인트 */
      --tag-bg: #f1f3f5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    /* 모바일 프레임 뷰포트 (PC에서도 모바일 뷰로 깔끔하게 고정) */
    .app-container {
      width: 100%;
      max-width: 440px;
      height: 860px;
      max-height: 92vh;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 28px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 상단 비공개 헤더 */
    header {
      padding: 20px 20px 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    .header-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-badge {
      font-size: 0.72rem;
      color: #10b981;
      font-weight: 600;
      background: #ecfdf5;
      padding: 4px 10px;
      border-radius: 12px;
    }

    .logout-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 0.8rem;
      cursor: pointer;
    }

    /* 서랍장 (카테고리 필터 탭) */
    .drawer-tabs {
      display: flex;
      gap: 6px;
      padding: 12px 20px;
      overflow-x: auto;
      border-bottom: 1px solid var(--border-color);
      scrollbar-width: none;
    }
    .drawer-tabs::-webkit-scrollbar { display: none; }

    .tab-btn {
      background: var(--tag-bg);
      border: none;
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-sub);
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--text-main);
      color: #ffffff;
    }

    /* 에디터 작성 영역 */
    .editor-section {
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #fafafa;
      border-bottom: 1px solid var(--border-color);
    }

    textarea {
      width: 100%;
      height: 90px;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      font-family: 'Pretendard', sans-serif;
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--text-main);
    }

    textarea::placeholder { color: #b0b0b0; }

    .editor-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tag-input {
      border: 1px solid var(--border-color);
      background: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      width: 60%;
      outline: none;
    }

    .save-btn {
      background: var(--accent-color);
      color: #fff;
      border: none;
      padding: 7px 18px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* 서랍장 타임라인 (메모 목록) */
    .timeline-section {
      flex: 1;
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .memo-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      padding: 14px 16px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .memo-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-sub);
    }

    .memo-tag {
      background: var(--tag-bg);
      padding: 2px 8px;
      border-radius: 4px;
      color: var(--text-main);
      font-weight: 500;
    }

    .memo-content {
      font-size: 0.92rem;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .memo-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      font-size: 0.75rem;
    }

    .action-btn {
      color: var(--text-sub);
      background: none;
      border: none;
      cursor: pointer;
    }

    @media (max-width: 480px) {
      body { padding: 0; background: var(--bg-card); }
      .app-container {
        max-width: 100%;
        height: 100vh;
        max-height: 100vh;
        border: none;
        border-radius: 0;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="header-title">비밀 서랍장</div>
      <div class="header-right">
        <span class="status-badge">나만 보기</span>
        <button id="logoutBtn" class="logout-btn">로그아웃</button>
      </div>
    </header>

    <!-- 카테고리 서랍장 필터 -->
    <div class="drawer-tabs">
      <button class="tab-btn active" onclick="filterCategory('전체')">전체</button>
      <button class="tab-btn" onclick="filterCategory('뒷담')">뒷담</button>
      <button class="tab-btn" onclick="filterCategory('영감')">영감/미학</button>
      <button class="tab-btn" onclick="filterCategory('생각')">생각/헛소리</button>
      <button class="tab-btn" onclick="filterCategory('일상')">일상</button>
    </div>

    <!-- 메모 작성 -->
    <div class="editor-section">
      <textarea id="memoInput" placeholder="생각을 남겨두세요... (예: 오늘 연예인 코디 미학적으로 지렸다)"></textarea>
      <div class="editor-bottom">
        <input type="text" id="tagInput" class="tag-input" placeholder="태그 (예: 뒷담, 영감, 일상)">
        <button id="saveBtn" class="save-btn">저장</button>
      </div>
    </div>

    <!-- 타임라인 -->
    <div id="timeline" class="timeline-section">
      <!-- 메모가 들어오는 위치 -->
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "water-log132.firebaseapp.com",
      projectId: "water-log132",
      storageBucket: "water-log132.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let currentUser = null;
    let allMemos = [];
    let currentFilter = '전체';

    const memoInput = document.getElementById("memoInput");
    const tagInput = document.getElementById("tagInput");
    const saveBtn = document.getElementById("saveBtn");
    const timeline = document.getElementById("timeline");
    const logoutBtn = document.getElementById("logoutBtn");

    // 로그인 통제 체크 (너만 들어오게)
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        loadMemos();
      } else {
        alert("로그인이 필요합니다.");
      }
    });

    // 메모 로드
    async function loadMemos() {
      if (!currentUser) return;
      timeline.innerHTML = "<div style='text-align:center; color:#888; font-size:0.8rem;'>서랍장 꺼내는 중...</div>";

      try {
        const q = query(collection(db, "users", currentUser.uid, "notes"), orderBy("createdAt", "desc"));
        const querySnapshot = await getDocs(q);
        allMemos = [];
        querySnapshot.forEach((docSnap) => {
          allMemos.push({ id: docSnap.id, ...docSnap.data() });
        });
        renderTimeline();
      } catch (err) {
        console.error(err);
        timeline.innerHTML = "<div style='text-align:center; color:#888; font-size:0.8rem;'>불러오기 실패</div>";
      }
    }

    // 타임라인 렌더링
    function renderTimeline() {
      timeline.innerHTML = "";
      const filtered = currentFilter === '전체' 
        ? allMemos 
        : allMemos.filter(m => (m.tag || '').includes(currentFilter));

      if (filtered.length === 0) {
        timeline.innerHTML = "<div style='text-align:center; color:#aaa; font-size:0.85rem; padding-top:20px;'>비어있는 서랍입니다.</div>";
        return;
      }

      filtered.forEach(memo => {
        const dateStr = memo.createdAt ? new Date(memo.createdAt.seconds * 1000).toLocaleString('ko-KR', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' }) : '';
        const card = document.createElement("div");
        card.className = "memo-card";
        card.innerHTML = `
          <div class="memo-header">
            <span class="memo-tag"># ${memo.tag || '미분류'}</span>
            <span>${dateStr}</span>
          </div>
          <div class="memo-content">${memo.content}</div>
          <div class="memo-footer">
            <button class="action-btn" onclick="deleteMemo('${memo.id}')">삭제</button>
          </div>
        `;
        timeline.appendChild(card);
      });
    }

    // 저장
    saveBtn.addEventListener("click", async () => {
      const content = memoInput.value.trim();
      const tag = tagInput.value.trim() || '일상';

      if (!content) return;

      saveBtn.disabled = true;
      try {
        await addDoc(collection(db, "users", currentUser.uid, "notes"), {
          content: content,
          tag: tag,
          createdAt: new Date()
        });
        memoInput.value = "";
        tagInput.value = "";
        loadMemos();
      } catch (e) {
        alert("저장 에러: " + e.message);
      } finally {
        saveBtn.disabled = false;
      }
    });

    // 필터링 global 처리
    window.filterCategory = (cat) => {
      currentFilter = cat;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText.includes(cat));
      });
      renderTimeline();
    };

    // 삭제 global 처리
    window.deleteMemo = async (id) => {
      if (confirm("이 메모를 서랍에서 지울까?")) {
        await deleteDoc(doc(db, "users", currentUser.uid, "notes", id));
        loadMemos();
      }
    };

    logoutBtn.addEventListener("click", () => signOut(auth));
  </script>
</body>
</html>
