<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비밀 서랍장</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase App & Auth SDK (v9+ CDN) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 1. 파이어베이스 설정 (본인 프로젝트 값 넣기)
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // 2. 인증 상태 체크 및 로그아웃 버튼 동작
    const logoutBtn = document.getElementById('logoutBtn');
    
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        // 로그인 안 되어 있으면 로그인 페이지로 튕기기 (필요시)
        // window.location.href = 'login.html';
      }
    });

    logoutBtn.addEventListener('click', async () => {
      try {
        await signOut(auth);
        alert('로그아웃 되었습니다.');
        location.reload();
      } catch (err) {
        console.error('로그아웃 에러:', err);
      }
    });

    // 3. Gemini API 기반 AI 자동 카테고리 분류 함수
    const GEMINI_API_KEY = "YOUR_GEMINI_API_KEY"; // API 키 입력

    async function classifyCategoryWithAI(text) {
      const prompt = `다음 텍스트를 읽고 [뒷담, 영감/미학, 생각/헛소리, 일상] 중 가장 적절한 카테고리 딱 하나만 정확히 단어로만 출력해줘. 다른 말은 절대 하지마.
텍스트: "${text}"`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
          })
        });

        const data = await response.json();
        const category = data.candidates[0].content.parts[0].text.trim();
        
        // 정해진 카테고리 범위 외 응답 예외처리
        const validCategories = ['뒷담', '영감/미학', '생각/헛소리', '일상'];
        return validCategories.includes(category) ? category : '생각/헛소리';
      } catch (error) {
        console.error('AI 분류 실패, 기본값 설정:', error);
        return '생각/헛소리'; // 실패 시 기본 카테고리
      }
    }

    // 4. 메모 저장 로직 (AI 분류 후 Firestore 저장)
    const saveBtn = document.getElementById('saveBtn');
    const memoInput = document.getElementById('memoInput');
    const statusText = document.getElementById('statusText');

    saveBtn.addEventListener('click', async () => {
      const content = memoInput.value.trim();
      if (!content) return alert('내용을 입력하세요.');

      saveBtn.disabled = true;
      statusText.innerText = '🤖 AI가 카테고리 분류 중...';

      // AI 분류 실행
      const autoCategory = await classifyCategoryWithAI(content);
      statusText.innerText = `분류 완료: [${autoCategory}] 저장 중...`;

      try {
        await addDoc(collection(db, "memos"), {
          content: content,
          category: autoCategory,
          createdAt: serverTimestamp()
        });

        memoInput.value = '';
        statusText.innerText = '저장 완료!';
        setTimeout(() => { statusText.innerText = ''; }, 2000);
      } catch (err) {
        console.error('저장 에러:', err);
        statusText.innerText = '저장 실패';
      } finally {
        saveBtn.disabled = false;
      }
    });
  </script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <!-- 메인 카드 컨테이너 -->
  <div class="w-full max-w-xl bg-white rounded-2xl shadow-sm border border-gray-100 p-6 space-y-6">
    
    <!-- 상단 헤더 -->
    <div class="flex justify-between items-center pb-4 border-b border-gray-100">
      <h1 class="text-xl font-bold text-gray-800">비밀 서랍장</h1>
      <div class="flex items-center space-x-4">
        <span class="text-xs font-semibold text-emerald-500 bg-emerald-50 px-2.5 py-1 rounded-full">나만 보기</span>
        <!-- 로그아웃 버튼 (z-index 및 ID 고정) -->
        <button id="logoutBtn" class="text-sm text-gray-400 hover:text-gray-600 transition cursor-pointer relative z-10">
          로그아웃
        </button>
      </div>
    </div>

    <!-- 카테고리 탭 (UI 표시용) -->
    <div class="flex space-x-2">
      <button class="px-4 py-1.5 rounded-full text-sm font-bold bg-black text-white">전체</button>
      <button class="px-4 py-1.5 rounded-full text-sm font-medium bg-gray-100 text-gray-500 hover:bg-gray-200">뒷담</button>
      <button class="px-4 py-1.5 rounded-full text-sm font-medium bg-gray-100 text-gray-500 hover:bg-gray-200">영감/미학</button>
      <button class="px-4 py-1.5 rounded-full text-sm font-medium bg-gray-100 text-gray-500 hover:bg-gray-200">생각/헛소리</button>
      <button class="px-4 py-1.5 rounded-full text-sm font-medium bg-gray-100 text-gray-500 hover:bg-gray-200">일상</button>
    </div>

    <!-- 텍스트 입력 창 -->
    <div>
      <textarea id="memoInput" rows="6" class="w-full p-4 resize-none border-0 focus:ring-0 text-gray-700 placeholder-gray-300 text-base" placeholder="생각을 자유롭게 적으세요..."></textarea>
    </div>

    <!-- 하단 액션 바 -->
    <div class="flex justify-between items-center pt-2 border-t border-gray-50">
      <span id="statusText" class="text-xs text-gray-400"></span>
      <!-- 저장 버튼 -->
      <button id="saveBtn" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm rounded-xl transition shadow-sm cursor-pointer disabled:bg-gray-300">
        저장
      </button>
    </div>

  </div>

</body>
</html>
