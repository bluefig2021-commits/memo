<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEMO</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link
    href="https://cdn.quilljs.com/1.3.6/quill.snow.css"
    rel="stylesheet"
  >
  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: white;
    }

    .ql-toolbar.ql-snow {
      border: none !important;
      border-bottom: 1px solid #f1f5f9 !important;
      padding: 8px 0 !important;
    }

    .ql-container.ql-snow {
      border: none !important;
      font-size: 15px;
      min-height: 380px;
    }

    .ql-editor {
      padding: 16px 0 !important;
      min-height: 380px;
    }

    .ql-editor.ql-blank::before {
      color: #cbd5e1;
      font-style: normal;
      left: 0 !important;
    }

    button {
      outline: none;
    }
  </style>
</head>

<body class="bg-white min-h-screen flex items-center justify-center text-slate-900 antialiased font-sans p-4">

  <!-- ==============================
       LOGIN
       ============================== -->

  <div
    id="loginView"
    class="hidden w-full max-w-sm"
  >

    <div class="mb-8">
      <div class="text-lg font-medium">MEMO</div>
      <div class="text-xs text-gray-400 mt-1">Private</div>
    </div>

    <form id="loginForm" class="space-y-3">

      <input
        id="emailInput"
        type="email"
        value="bluefig2021@gmail.com"
        autocomplete="email"
        placeholder="Email"
        class="w-full border-b border-gray-200 px-1 py-3 text-sm outline-none focus:border-black"
      >

      <input
        id="passwordInput"
        type="password"
        autocomplete="current-password"
        placeholder="Password"
        class="w-full border-b border-gray-200 px-1 py-3 text-sm outline-none focus:border-black"
      >

      <button
        type="submit"
        id="loginBtn"
        class="w-full mt-4 py-3 bg-black text-white text-xs rounded-full"
      >
        ENTER
      </button>

      <div
        id="loginStatus"
        class="text-center text-xs text-gray-400 pt-2"
      ></div>

    </form>
  </div>


  <!-- ==============================
       MEMO
       ============================== -->

  <main
    id="mainView"
    class="hidden w-full max-w-2xl space-y-4"
  >

    <!-- HEADER -->

    <div class="flex justify-between items-center pb-3 border-b border-gray-100">

      <div class="flex gap-2">

        <button
          id="editBtn"
          type="button"
          class="px-4 py-1.5 rounded-full border border-gray-200 text-xs text-gray-500"
        >
          EDIT
        </button>

        <button
          id="categoryBtn"
          type="button"
          class="px-4 py-1.5 rounded-full border border-gray-200 text-xs text-gray-500"
        >
          CATEGORY
        </button>

      </div>

      <button
        id="logoutBtn"
        type="button"
        class="text-[10px] text-gray-300 font-mono"
      >
        LOCK
      </button>

    </div>


    <!-- CATEGORY -->

    <div
      id="categoryPanel"
      class="hidden border-b border-gray-100 pb-4"
    >

      <div class="flex gap-2 mb-3">

        <input
          id="categoryInput"
          type="text"
          placeholder="New category"
          class="flex-1 border-b border-gray-200 px-1 py-2 text-xs outline-none focus:border-black"
        >

        <button
          id="addCategoryBtn"
          type="button"
          class="px-4 py-2 bg-black text-white rounded-full text-xs"
        >
          ADD
        </button>

      </div>

      <div
        id="categoryList"
        class="flex flex-wrap gap-2"
      ></div>

    </div>


    <!-- SELECTED CATEGORY -->

    <div
      id="currentCategory"
      class="hidden text-[10px] text-gray-400 font-mono"
    ></div>


    <!-- EDITOR -->

    <div id="editor"></div>


    <!-- ACTION -->

    <div class="flex justify-between items-center pt-3 border-t border-gray-100">

      <span
        id="statusText"
        class="text-xs text-gray-400 font-mono"
      ></span>

      <button
        id="saveBtn"
        type="button"
        class="px-6 py-2 bg-black hover:bg-slate-900 text-white font-medium text-xs rounded-full disabled:bg-gray-200"
      >
        DONE
      </button>

    </div>


    <!-- SAVED MEMOS -->

    <div
      id="memoList"
      class="border-t border-gray-100 pt-5 mt-5 space-y-3"
    ></div>

  </main>


  <!-- ==============================
       FIREBASE
       ============================== -->

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signInWithEmailAndPassword,
      signOut,
      setPersistence,
      browserLocalPersistence
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      addDoc,
      getDocs,
      query,
      orderBy,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


    /* ==============================
       FIREBASE CONFIG
       ============================== */

    const firebaseConfig = {
      apiKey: "AIzaSyAagWKtXuvQOhV-__Mxmd5ys8vs0xDDCUs",
      authDomain: "water-log132.firebaseapp.com",
      projectId: "water-log132",
      storageBucket: "water-log132.firebasestorage.app",
      messagingSenderId: "569667354916",
      appId: "1:569667354916:web:6cc37173ed1c9c2cf7f3b1",
      measurementId: "G-2L6JGTPD41"
    };


    const ADMIN_EMAIL = "bluefig2021@gmail.com";

    const ADMIN_UID = "XSYfAjjpAOaOADfYaWlJmF3q4IY2";


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    /* 로그인 상태 유지 */

    await setPersistence(
      auth,
      browserLocalPersistence
    );


    /* ==============================
       ELEMENTS
       ============================== */

    const loginView =
      document.getElementById("loginView");

    const mainView =
      document.getElementById("mainView");

    const loginForm =
      document.getElementById("loginForm");

    const emailInput =
      document.getElementById("emailInput");

    const passwordInput =
      document.getElementById("passwordInput");

    const loginBtn =
      document.getElementById("loginBtn");

    const loginStatus =
      document.getElementById("loginStatus");

    const logoutBtn =
      document.getElementById("logoutBtn");

    const statusText =
      document.getElementById("statusText");


    /* ==============================
       QUILL
       ============================== */

    const quill = new Quill("#editor", {

      theme: "snow",

      placeholder: "Type something...",

      modules: {
        toolbar: [
          [
            {
              header: [1, 2, false]
            }
          ],
          [
            "bold",
            "underline",
            "strike"
          ],
          [
            {
              list: "ordered"
            },
            {
              list: "bullet"
            }
          ],
          [
            "blockquote",
            "link"
          ],
          [
            "clean"
          ]
        ]
      }

    });


    /* ==============================
       AUTH
       ============================== */

    onAuthStateChanged(auth, async (user) => {

      if (
        user &&
        user.uid === ADMIN_UID &&
        user.email === ADMIN_EMAIL
      ) {

        loginView.classList.add("hidden");

        mainView.classList.remove("hidden");

        await loadCategories();

        await loadMemos();

      } else {

        mainView.classList.add("hidden");

        loginView.classList.remove("hidden");

      }

    });


    /* ==============================
       LOGIN
       ============================== */

    loginForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;


        if (email !== ADMIN_EMAIL) {

          loginStatus.textContent =
            "ACCESS DENIED";

          return;

        }


        loginBtn.disabled = true;

        loginStatus.textContent =
          "ENTERING...";


        try {

          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );

          passwordInput.value = "";

        } catch (error) {

          console.error(error);

          loginStatus.textContent =
            "LOGIN FAILED";

        } finally {

          loginBtn.disabled = false;

        }

      }
    );


    /* ==============================
       LOGOUT / LOCK
       ============================== */

    logoutBtn.addEventListener(
      "click",
      async () => {

        await signOut(auth);

      }
    );


    /* ==============================
       EDIT BUTTON
       ============================== */

    document
      .getElementById("editBtn")
      .addEventListener("click", function () {

        this.classList.toggle("bg-slate-900");
        this.classList.toggle("text-white");

      });


    /* ==============================
       CATEGORY
       ============================== */

    const categoryBtn =
      document.getElementById("categoryBtn");

    const categoryPanel =
      document.getElementById("categoryPanel");

    const categoryInput =
      document.getElementById("categoryInput");

    const addCategoryBtn =
      document.getElementById("addCategoryBtn");

    const categoryList =
      document.getElementById("categoryList");

    const currentCategory =
      document.getElementById("currentCategory");


    let categories = [];

    let selectedCategory = "";


    categoryBtn.addEventListener(
      "click",
      () => {

        categoryPanel.classList.toggle("hidden");

      }
    );


    async function loadCategories() {

      categoryList.innerHTML = "";

      try {

        const snapshot =
          await getDocs(
            collection(
              db,
              "users",
              ADMIN_UID,
              "categories"
            )
          );


        categories = [];

        snapshot.forEach(doc => {

          categories.push({
            id: doc.id,
            ...doc.data()
          });

        });


        renderCategories();

      } catch (error) {

        console.error(
          "Category load error:",
          error
        );

      }

    }


    function renderCategories() {

      categoryList.innerHTML = "";


      categories.forEach(category => {

        const button =
          document.createElement("button");

        button.type = "button";

        button.textContent =
          category.name;

        button.className =
          "px-3 py-1.5 rounded-full border border-gray-200 text-xs text-gray-500 hover:border-black";


        button.addEventListener(
          "click",
          () => {

            selectedCategory =
              category.name;

            currentCategory.textContent =
              "CATEGORY / " +
              selectedCategory;

            currentCategory.classList.remove(
              "hidden"
            );

            categoryPanel.classList.add(
              "hidden"
            );

          }
        );


        categoryList.appendChild(button);

      });

    }


    async function addCategory() {

      const name =
        categoryInput.value.trim();


      if (!name) return;


      if (
        categories.some(
          category =>
            category.name === name
        )
      ) {

        selectedCategory = name;

        categoryInput.value = "";

        categoryPanel.classList.add(
          "hidden"
        );

        currentCategory.textContent =
          "CATEGORY / " + name;

        currentCategory.classList.remove(
          "hidden"
        );

        return;

      }


      try {

        await addDoc(
          collection(
            db,
            "users",
            ADMIN_UID,
            "categories"
          ),
          {
            name: name,
            createdAt: serverTimestamp()
          }
        );


        categoryInput.value = "";

        selectedCategory = name;

        currentCategory.textContent =
          "CATEGORY / " + name;

        currentCategory.classList.remove(
          "hidden"
        );

        await loadCategories();

        categoryPanel.classList.add(
          "hidden"
        );

      } catch (error) {

        console.error(
          "Category save error:",
          error
        );

      }

    }


    addCategoryBtn.addEventListener(
      "click",
      addCategory
    );


    categoryInput.addEventListener(
      "keydown",
      event => {

        if (event.key === "Enter") {

          event.preventDefault();

          addCategory();

        }

      }
    );


    /* ==============================
       SAVE MEMO
       ============================== */

    const saveBtn =
      document.getElementById("saveBtn");


    saveBtn.addEventListener(
      "click",
      async () => {

        const user = auth.currentUser;


        if (
          !user ||
          user.uid !== ADMIN_UID
        ) {

          statusText.textContent =
            "ACCESS DENIED";

          return;

        }


        const htmlContent =
          quill.root.innerHTML;

        const textContent =
          quill.getText().trim();


        if (!textContent) {

          statusText.textContent =
            "EMPTY";

          return;

        }


        saveBtn.disabled = true;

        statusText.textContent =
          "SAVING...";


        try {

          await addDoc(
            collection(
              db,
              "users",
              ADMIN_UID,
              "memos"
            ),
            {

              content: htmlContent,

              rawText: textContent,

              category: selectedCategory || "",

              createdAt: serverTimestamp()

            }
          );


          quill.setText("");

          statusText.textContent =
            "SAVED";


          await loadMemos();


          setTimeout(() => {

            statusText.textContent = "";

          }, 2000);


        } catch (error) {

          console.error(
            "Memo save error:",
            error
          );

          statusText.textContent =
            "ERROR";

        } finally {

          saveBtn.disabled = false;

        }

      }
    );


    /* ==============================
       LOAD MEMOS
       ============================== */

    const memoList =
      document.getElementById("memoList");


    async function loadMemos() {

      memoList.innerHTML = "";


      try {

        const memoQuery =
          query(
            collection(
              db,
              "users",
              ADMIN_UID,
              "memos"
            ),
            orderBy(
              "createdAt",
              "desc"
            )
          );


        const snapshot =
          await getDocs(memoQuery);


        snapshot.forEach(doc => {

          const memo =
            doc.data();


          const wrapper =
            document.createElement("div");

          wrapper.className =
            "border-b border-gray-100 pb-4";


          const category =
            memo.category
              ? `<div class="text-[10px] text-gray-400 font-mono mb-2">CATEGORY / ${escapeHtml(memo.category)}</div>`
              : "";


          const content =
            `<div class="text-sm leading-7">${memo.content}</div>`;


          wrapper.innerHTML =
            category + content;


          memoList.appendChild(
            wrapper
          );

        });


      } catch (error) {

        console.error(
          "Memo load error:",
          error
        );

      }

    }


    function escapeHtml(text) {

      const div =
        document.createElement("div");

      div.textContent = text;

      return div.innerHTML;

    }

  </script>

</body>
</html>
