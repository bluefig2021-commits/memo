<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEMO</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 30px; color: #333; max-width: 800px; margin: 0 auto; background: #fff; }
    
    #loginView { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 80vh; gap: 20px; }
    .title-logo { font-size: 12px; letter-spacing: 4px; color: #aaa; font-weight: bold; }
    
    #mainView { display: none; }
    
    .header { display: flex; align-items: center; gap: 20px; border-bottom: 1px solid #eee; padding-bottom: 15px; margin-bottom: 20px; }
    .btn { padding: 5px 15px; border: 1px solid #ccc; border-radius: 15px; background: #fff; cursor: pointer; font-size: 12px; letter-spacing: 1px; color: #888; }
    .btn-black { background: #000; color: #fff; border: none; padding: 10px 30px; border-radius: 20px; font-weight: bold; font-size: 14px; letter-spacing: 1px; cursor: pointer; }
    
    .category-wrapper { display: flex; align-items: center; gap: 10px; }
    .category-label { font-size: 12px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
    
    /* 네이비색 타원형(알약 뱃지) 카테고리 태그 */
    .category-tag { 
      border: 1px solid #0f172a; 
      background: #0f172a; 
      color: #ffffff; 
      border-radius: 20px; 
      outline: none; 
      font-size: 12px; 
      font-weight: 600;
      padding: 6px 16px; 
      width: 100px; 
      text-align: center; 
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .category-tag:focus {
      background: #ffffff;
      color: #0f172a;
      border-color: #0f172a;
      cursor: text;
    }
    
    .toolbar { display: flex; gap: 15px; font-size: 14px; color: #555; padding-bottom: 10px; margin-bottom: 20px; font-weight: bold; }
    .editor-container { min-height: 400px; outline: none; font-size: 16px; line-height: 1.6; padding-bottom: 20px; }
    .footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #eee; padding-top: 20px; }
    #statusMsg { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }
  </style>
</head>
<body>

  <div id="loginView">
    <div class="title-logo">PRIVATE LOG</div>
    <button id="googleLoginBtn" class="btn-black">GOOGLE LOGIN</button>
    <div id="loginError" style="color: #ff4d4f; font-size: 12px; margin-top: 10px;"></div>
  </div>

  <div id="mainView">
    <div class="header">
      <button class="btn" id="logoutBtn">LOGOUT</button>
      <div class="category-wrapper">
        <span class="category-label">CATEGORY</span>
        <input type="text" id="categoryInput" class="category-tag" list="categoryList" placeholder="Normal" value="Normal">
        <datalist id="categoryList">
          <option value="Normal">
          <option value="Idea">
          <option value="Log">
        </datalist>
      </div>
    </div>

    <div class="toolbar">
      <span>B</span> <span>U</span> <span style="text-decoration: line-through;">S</span> <span>≡</span> <span>"</span> <span>🔗</span>
    </div>

    <div id="editor" class="editor-container" contenteditable="true"></div>

    <div class="footer">
      <span id="statusMsg"></span>
      <button id="doneBtn" class="btn-black">DONE</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const ADMIN_EMAIL = "raizn199x@gmail.com";

    const firebaseConfig = {
      apiKey: "AIzaSyDWYC-g2LwKA10RUXYB2_5vXNULAcbUVFo",
      authDomain: "memo-9d3d7.firebaseapp.com",
      projectId: "memo-9d3d7",
      storageBucket: "memo-9d3d7.firebasestorage.app",
      messagingSenderId: "648840817270",
      appId: "1:648840817270:web:230131f24b1c311c41cd57",
      measurementId: "G-JFYQHSE5MJ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });

    const loginView = document.getElementById('loginView');
    const mainView = document.getElementById('mainView');
    const googleLoginBtn = document.getElementById('googleLoginBtn');
    const loginError = document.getElementById('loginError');
    const logoutBtn = document.getElementById('logoutBtn');
    
    const statusMsg = document.getElementById('statusMsg');
    const doneBtn = document.getElementById('doneBtn');
    const editor = document.getElementById('editor');
    const categoryInput = document.getElementById('categoryInput');

    setPersistence(auth, browserLocalPersistence);

    googleLoginBtn.addEventListener('click', async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (error) {
        loginError.innerText = "로그인 실패: " + error.message;
      }
    });

    logoutBtn.addEventListener('click', () => {
      signOut(auth);
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        if (user.email === ADMIN_EMAIL) {
          loginView.style.display = "none";
          mainView.style.display = "block";
          loginError.innerText = "";
        } else {
          signOut(auth);
          loginError.innerText = "접근 권한이 없는 계정입니다.";
        }
      } else {
        loginView.style.display = "flex";
        mainView.style.display = "none";
      }
    });

    doneBtn.addEventListener('click', async () => {
      const content = editor.innerHTML.trim();
      const category = categoryInput.value.trim() || "Normal";

      if (!content) {
        statusMsg.innerText = "EMPTY";
        statusMsg.style.color = "#ff4d4f";
        return;
      }

      try {
        statusMsg.innerText = "SAVING...";
        statusMsg.style.color = "#888";
        doneBtn.disabled = true;

        await addDoc(collection(db, "memos"), {
          category: category,
          content: content,
          createdAt: serverTimestamp()
        });

        statusMsg.innerText = "SAVED";
        statusMsg.style.color = "#0f172a";
        editor.innerHTML = "";
      } catch (e) {
        statusMsg.innerText = "ERROR: " + e.message;
        statusMsg.style.color = "#ff4d4f";
      } finally {
        doneBtn.disabled = false;
        setTimeout(() => { statusMsg.innerText = ""; }, 2000);
      }
    });
  </script>
</body>
</html>
