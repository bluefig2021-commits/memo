<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEMO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
  <style>
    /* 미니멀 iOS 모노톤 에디터, 군더더기 다 뺌 */
    .ql-toolbar.ql-snow {
      border: none !important;
      border-bottom: 1px solid #f1f5f9 !important;
      padding: 8px 0 !important;
    }
    .ql-container.ql-snow {
      border: none !important;
      font-size: 15px;
      min-height: 400px;
    }
    .ql-editor {
      padding: 16px 0 !important;
    }
    .ql-editor.ql-blank::before {
      color: #cbd5e1;
      font-style: normal;
      left: 0 !important;
    }
    .btn-pill {
      transition: all 0.15s ease-in-out;
    }
  </style>
</head>
<body class="bg-white min-h-screen flex items-center justify-center text-slate-900 antialiased font-sans p-4">

  <!-- MAIN MEMO VIEW (기본 숨김 처리, 비밀번호 통과해야만 보임) -->
  <div id="mainView" class="hidden w-full max-w-2xl space-y-4">
    
    <!-- HEADER (타원형 버튼 배치) -->
    <div class="flex justify-between items-center pb-3 border-b border-gray-100">
      <div class="flex gap-2">
        <button id="editBtn" class="btn-pill px-4 py-1.5 rounded-full border border-gray-200 text-xs text-gray-500 hover:border-gray-400 focus:outline-none">EDIT</button>
        <button id="categoryBtn" class="btn-pill px-4 py-1.5 rounded-full border border-gray-200 text-xs text-gray-500 hover:border-gray-400 focus:outline-none">CATEGORY</button>
      </div>
      <span id="authStatus" class="text-[10px] text-gray-300 font-mono tracking-widest">PRIVATE</span>
    </div>

    <!-- WYSIWYG EDITOR -->
    <div id="editor"></div>

    <!-- ACTION BAR -->
    <div class="flex justify-between items-center pt-3 border-t border-gray-100">
      <span id="statusText" class="text-xs text-gray-400 font-mono tracking-wider"></span>
      <button id="saveBtn" type="button" class="px-6 py-2 bg-black hover:bg-slate-900 text-white font-bold text-xs rounded-full tracking-widest transition disabled:bg-gray-200">
        DONE
      </button>
    </div>
  </div>

  <!-- FIREBASE & LOGIC -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 🚨 수민아, 아래 큰따옴표 안에 네 파이어베이스 계정 이메일을 무조건 적어줘야 해!
    const MY_EMAIL = "YOUR_EMAIL@gmail.com"; 

    const firebaseConfig = {
      apiKey: "AIzaSyAagWKtXuvQOhV-__Mxmd5ys8vs0xDDCUs",
      authDomain: "water-log132.firebaseapp.com",
      projectId: "water-log132",
      storageBucket: "water-log132.firebasestorage.app",
      messagingSenderId: "569667354916",
      appId: "1:569667354916:web:6cc37173ed1c9c2cf7f3b1",
      measurementId: "G-2L6JGTPD41"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const mainView = document.getElementById('mainView');
    let currentCategory = 'CATEGORY'; // 저장될 카테고리 기본값

    // 한 번 접속하면 로그인 풀리지 않게 브라우저에 영구 세션 고정
    setPersistence(auth, browserLocalPersistence).catch(console.error);

    // Quill 에디터 초기화
    const quill = new Quill('#editor', {
      theme: 'snow',
      placeholder: '기록을 남기세요...',
      modules: {
        toolbar: [
          [{ 'header': [1, 2, false] }],
          ['bold', 'underline', 'strike'],
          [{ 'list': 'ordered'}, { 'list': 'bullet' }],
          ['blockquote', 'link'],
          ['clean']
        ]
      }
    });

    // 1. 보안 및 백그라운드 로그인 로직 (화면 대신 브라우저 팝업 활용)
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        // 로그인 안 되어 있으면 화면 백지로 두고 비밀번호만 묻기
        mainView.classList.add('hidden');
        
        // 브라우저 기본 알림창으로 깔끔하게 비밀번호만 요구
        const pwd = prompt("접근 권한이 필요합니다. PASSKEY를 입력하세요.");
        
        if (pwd) {
          try {
            await signInWithEmailAndPassword(auth, MY_EMAIL, pwd);
            // 로그인 성공하면 페이지 새로고침해서 에디터 띄움
            location.reload(); 
          } catch (err) {
            alert("인증 실패. 접근이 거부되었습니다.");
            document.body.innerHTML = "<div class='flex h-screen items-center justify-center font-mono text-gray-400 tracking-widest text-sm'>ACCESS DENIED</div>";
          }
        } else {
          document.body.innerHTML = "<div class='flex h-screen items-center justify-center font-mono text-gray-400 tracking-widest text-sm'>ACCESS DENIED</div>";
        }
      } else {
        // 로그인 상태면 바로 에디터 띄우고 마지막 글 불러오기
        mainView.classList.remove('hidden');
        loadLastMemo();
      }
    });

    // 2. 마지막 작성 메모 불러오기 기능
    async function loadLastMemo() {
      try {
        const q = query(collection(db, "memos"), orderBy("createdAt", "desc"), limit(1));
        const snap = await getDocs(q);
        snap.forEach((doc) => {
          const data = doc.data();
          // 에디터에 기존 글 꽂아넣기
          quill.root.innerHTML = data.content;
          
          // 카테고리가 있었다면 버튼에 반영하고 활성화 색상 입히기
          if (data.category && data.category !== 'CATEGORY') {
            currentCategory = data.category;
            categoryBtn.innerText = currentCategory;
            categoryBtn.classList.add('bg-slate-900', 'text-white', 'border-slate-900');
            categoryBtn.classList.remove('text-gray-500', 'border-gray-200');
          }
        });
      } catch (err) {
        console.error("기존 데이터를 불러오지 못했습니다.", err);
      }
    }

    // 3. EDIT 버튼 토글 (단순 시각적 반응)
    const editBtn = document.getElementById('editBtn');
    editBtn.addEventListener('click', () => {
      editBtn.classList.toggle('bg-slate-900');
      editBtn.classList.toggle('text-white');
      editBtn.classList.toggle('border-slate-900');
      editBtn.classList.toggle('text-gray-500');
      editBtn.classList.toggle('border-gray-200');
    });

    // 4. CATEGORY 버튼 누르면 직접 텍스트 입력받기
    const categoryBtn = document.getElementById('categoryBtn');
    categoryBtn.addEventListener('click', () => {
      const userInput = prompt("새로운 카테고리명을 입력하세요:", currentCategory);
      if (userInput) {
        currentCategory = userInput;
        categoryBtn.innerText = currentCategory;
        // 선택되면 네이비 톤으로 고정
        categoryBtn.classList.add('bg-slate-900', 'text-white', 'border-slate-900');
        categoryBtn.classList.remove('text-gray-500', 'border-gray-200');
      }
    });

    // 5. DONE 버튼 누르면 파이어베이스에 저장
    const saveBtn = document.getElementById('saveBtn');
    const statusText = document.getElementById('statusText');

    saveBtn.addEventListener('click', async () => {
      const htmlContent = quill.root.innerHTML;
      const textContent = quill.getText().trim();

      if (!textContent) {
        statusText.innerText = 'EMPTY';
        return;
      }

      saveBtn.disabled = true;
      statusText.innerText = 'SAVING...';

      try {
        await addDoc(collection(db, "memos"), {
          content: htmlContent,
          rawText: textContent,
          category: currentCategory,
          createdAt: serverTimestamp()
        });

        statusText.innerText = 'SAVED';
        setTimeout(() => { statusText.innerText = ''; }, 2000);
      } catch (err) {
        console.error('Firestore save error:', err);
        statusText.innerText = 'ERROR';
      } finally {
        saveBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
