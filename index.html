<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MEMO</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Quill -->
  <link
    href="https://cdn.quilljs.com/1.3.6/quill.snow.css"
    rel="stylesheet"
  >
  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>

  <style>
    /* 전체 */
    html,
    body {
      margin: 0;
      padding: 0;
      background: white;
    }

    /* Quill 툴바 */
    .ql-toolbar.ql-snow {
      border: none !important;
      border-bottom: 1px solid #f1f5f9 !important;
      padding: 8px 0 !important;
    }

    /* Quill 에디터 */
    .ql-container.ql-snow {
      border: none !important;
      font-size: 15px;
      min-height: 380px;
    }

    .ql-editor {
      padding: 16px 0 !important;
      min-height: 380px;
    }

    .ql-editor.ql-blank::before {
      color: #cbd5e1;
      font-style: normal;
      left: 0 !important;
    }

    /* 버튼 */
    .btn-pill {
      transition: all 0.15s ease-in-out;
    }

    /* 포커스 시 파란 테두리 제거 */
    button:focus {
      outline: none;
    }
  </style>
</head>

<body class="bg-white min-h-screen flex items-center justify-center text-slate-900 antialiased font-sans p-4">

  <!-- =========================================================
       MEMO
       로그인 화면 없음
       페이지 접속 즉시 여기부터 시작
       ========================================================= -->

  <main id="mainView" class="w-full max-w-2xl space-y-4">

    <!-- HEADER -->
    <header class="flex justify-between items-center pb-3 border-b border-gray-100">

      <div class="flex gap-2">

        <button
          id="editBtn"
          type="button"
          class="btn-pill px-4 py-1.5 rounded-full border border-gray-200 text-xs text-gray-500 hover:border-gray-400"
        >
          EDIT
        </button>

        <button
          id="categoryBtn"
          type="button"
          class="btn-pill px-4 py-1.5 rounded-full border border-gray-200 text-xs text-gray-500 hover:border-gray-400"
        >
          CATEGORY
        </button>

      </div>

      <!-- 로그인 상태를 화면에 표시하지 않음 -->
      <span
        id="authStatus"
        class="text-[10px] text-gray-300 font-mono"
      ></span>

    </header>


    <!-- =========================================================
         EDITOR
         ========================================================= -->

    <div id="editor"></div>


    <!-- =========================================================
         ACTION BAR
         ========================================================= -->

    <div class="flex justify-between items-center pt-3 border-t border-gray-100">

      <span
        id="statusText"
        class="text-xs text-gray-400 font-mono"
      ></span>

      <button
        id="saveBtn"
        type="button"
        class="px-6 py-2 bg-black hover:bg-slate-900 text-white font-medium text-xs rounded-full transition disabled:bg-gray-200"
      >
        DONE
      </button>

    </div>

  </main>


  <!-- =========================================================
       FIREBASE + LOGIC
       ========================================================= -->

  <script type="module">

    /* ---------------------------------------------------------
       Firebase
       --------------------------------------------------------- */

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

    import {
      getAuth,
      signInAnonymously
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      addDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


    /* ---------------------------------------------------------
       Firebase 설정
       --------------------------------------------------------- */

    const firebaseConfig = {
      apiKey: "AIzaSyAagWKtXuvQOhV-__Mxmd5ys8vs0xDDCUs",
      authDomain: "water-log132.firebaseapp.com",
      projectId: "water-log132",
      storageBucket: "water-log132.firebasestorage.app",
      messagingSenderId: "569667354916",
      appId: "1:569667354916:web:6cc37173ed1c9c2cf7f3b1",
      measurementId: "G-2L6JGTPD41"
    };


    /* ---------------------------------------------------------
       Firebase 초기화
       --------------------------------------------------------- */

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    /* ---------------------------------------------------------
       익명 인증
       
       중요:
       이메일 / 비밀번호 로그인 화면 없음.
       사용자가 로그인할 필요도 없음.
       백그라운드에서만 익명 인증.
       --------------------------------------------------------- */

    let currentUser = null;

    try {

      const result = await signInAnonymously(auth);

      currentUser = result.user;

    } catch (error) {

      console.error("Anonymous authentication error:", error);

    }


    /* ---------------------------------------------------------
       Quill 에디터
       --------------------------------------------------------- */

    const quill = new Quill("#editor", {

      theme: "snow",

      placeholder: "Type something...",

      modules: {

        toolbar: [

          [
            {
              header: [1, 2, false]
            }
          ],

          [
            "bold",
            "underline",
            "strike"
          ],

          [
            {
              list: "ordered"
            },
            {
              list: "bullet"
            }
          ],

          [
            "blockquote",
            "link"
          ],

          [
            "clean"
          ]

        ]

      }

    });


    /* ---------------------------------------------------------
       EDIT / CATEGORY 버튼
       --------------------------------------------------------- */

    function setupToggleButton(id) {

      const button = document.getElementById(id);

      button.addEventListener("click", () => {

        button.classList.toggle("bg-slate-900");
        button.classList.toggle("text-white");
        button.classList.toggle("border-slate-900");

        button.classList.toggle("text-gray-500");
        button.classList.toggle("border-gray-200");

      });

    }

    setupToggleButton("editBtn");
    setupToggleButton("categoryBtn");


    /* ---------------------------------------------------------
       저장
       --------------------------------------------------------- */

    const saveBtn = document.getElementById("saveBtn");

    const statusText = document.getElementById("statusText");


    saveBtn.addEventListener("click", async () => {

      const htmlContent = quill.root.innerHTML;

      const textContent = quill
        .getText()
        .trim();


      /* 빈 메모 */
      if (!textContent) {

        statusText.innerText = "EMPTY";

        return;

      }


      /* 저장 중 */
      saveBtn.disabled = true;

      statusText.innerText = "SAVING...";


      try {

        /* 익명 인증이 성공한 경우 Firestore 저장 */

        if (!currentUser) {

          throw new Error("Authentication failed.");

        }


        await addDoc(
          collection(db, "memos"),
          {

            content: htmlContent,

            rawText: textContent,

            createdAt: serverTimestamp(),

            uid: currentUser.uid

          }
        );


        /* 저장 성공 → 에디터 비우기 */

        quill.setText("");

        statusText.innerText = "SAVED";


        setTimeout(() => {

          statusText.innerText = "";

        }, 2000);


      } catch (error) {

        console.error(
          "Firestore save error:",
          error
        );

        statusText.innerText = "ERROR";


      } finally {

        saveBtn.disabled = false;

      }

    });

  </script>

</body>
</html>
