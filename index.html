<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEMO</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Quill Editor CSS & JS -->
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
  <style>
    /* 에디터 테두리 및 텍스처 각지게 커스텀 */
    .ql-toolbar.ql-snow {
      border: 1px solid #e5e7eb !important;
      border-bottom: none !important;
      background-color: #fafafa;
    }
    .ql-container.ql-snow {
      border: 1px solid #e5e7eb !important;
      font-size: 15px;
      min-height: 180px;
    }
    .ql-editor.ql-blank::before {
      color: #9ca3af;
      font-style: normal;
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4 text-gray-900 font-sans">

  <!-- 1. 로그인 화면 -->
  <div id="loginView" class="hidden w-full max-w-sm bg-white border border-gray-200 p-6 space-y-4">
    <h1 class="text-lg font-bold tracking-tight mb-6">LOG IN</h1>
    <div class="space-y-3">
      <input type="email" id="emailInput" placeholder="EMAIL" class="w-full p-3 border border-gray-200 text-sm focus:outline-none focus:border-black">
      <input type="password" id="passwordInput" placeholder="PASSWORD" class="w-full p-3 border border-gray-200 text-sm focus:outline-none focus:border-black">
      <button id="loginBtn" class="w-full py-3 bg-black text-white font-medium text-sm hover:bg-gray-800 transition">ENTRANCE</button>
    </div>
    <p id="loginError" class="text-xs text-red-500 min-h-[16px]"></p>
  </div>

  <!-- 2. 메인 메모 작성 화면 -->
  <div id="mainView" class="hidden w-full max-w-xl bg-white border border-gray-200 p-6 space-y-5">
    
    <!-- 상단 헤더 -->
    <div class="flex justify-between items-center pb-3 border-b border-gray-200">
      <span class="text-xs tracking-widest text-gray-400 font-mono">PRIVATE LOG</span>
      <button id="logoutBtn" type="button" class="text-xs text-gray-400 hover:text-black transition uppercase font-mono">
        LOGOUT
      </button>
    </div>

    <!-- 카테고리 수동 선택 탭 -->
    <div id="categoryGroup" class="flex flex-wrap gap-2 pt-1">
      <button type="button" data-value="뒷담" class="category-btn px-3 py-1.5 border border-gray-200 text-xs font-medium text-gray-600 hover:border-black">뒷담</button>
      <button type="button" data-value="영감/미학" class="category-btn px-3 py-1.5 border border-gray-200 text-xs font-medium text-gray-600 hover:border-black">영감/미학</button>
      <button type="button" data-value="생각/헛소리" class="category-btn px-3 py-1.5 border border-black bg-black text-white text-xs font-medium">생각/헛소리</button>
      <button type="button" data-value="일상" class="category-btn px-3 py-1.5 border border-gray-200 text-xs font-medium text-gray-600 hover:border-black">일상</button>
    </div>

    <!-- 서식 에디터 영역 (Quill) -->
    <div>
      <div id="editor"></div>
    </div>

    <!-- 하단 액션 바 -->
    <div class="flex justify-between items-center pt-2 border-t border-gray-100">
      <span id="statusText" class="text-xs text-gray-400 font-mono"></span>
      <button id="saveBtn" type="button" class="px-6 py-2 bg-black hover:bg-gray-800 text-white font-medium text-xs tracking-wider uppercase transition disabled:bg-gray-300">
        SAVE
      </button>
    </div>

  </div>

  <!-- Firebase 및 애플리케이션 로직 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAagWKtXuvQOhV-__Mxmd5ys8vs0xDDCUs",
      authDomain: "water-log132.firebaseapp.com",
      projectId: "water-log132",
      storageBucket: "water-log132.firebasestorage.app",
      messagingSenderId: "569667354916",
      appId: "1:569667354916:web:6cc37173ed1c9c2cf7f3b1",
      measurementId: "G-2L6JGTPD41"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Quill 에디터 초기화
    const quill = new Quill('#editor', {
      theme: 'snow',
      placeholder: '텍스트 작성...',
      modules: {
        toolbar: [
          [{ 'header': [1, 2, false] }],
          ['bold', 'italic', 'underline', 'strike'],
          [{ 'list': 'ordered'}, { 'list': 'bullet' }],
          ['blockquote', 'code-block', 'link'],
          ['clean']
        ]
      }
    });

    const loginView = document.getElementById('loginView');
    const mainView = document.getElementById('mainView');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const loginError = document.getElementById('loginError');

    // 카테고리 선택 상태 관리 (기본값: 생각/헛소리)
    let selectedCategory = '생각/헛소리';
    const categoryButtons = document.querySelectorAll('.category-btn');

    categoryButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        categoryButtons.forEach(b => {
          b.className = "category-btn px-3 py-1.5 border border-gray-200 text-xs font-medium text-gray-600 hover:border-black";
        });
        btn.className = "category-btn px-3 py-1.5 border border-black bg-black text-white text-xs font-medium";
        selectedCategory = btn.getAttribute('data-value');
      });
    });

    // 로그인 상태 감지
    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginView.classList.add('hidden');
        mainView.classList.remove('hidden');
      } else {
        mainView.classList.add('hidden');
        loginView.classList.remove('hidden');
      }
    });

    // 로그인
    loginBtn.addEventListener('click', async () => {
      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passwordInput').value.trim();
      loginError.innerText = '';

      if (!email || !password) {
        loginError.innerText = '이메일과 비밀번호를 입력하세요.';
        return;
      }

      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        console.error("로그인 실패:", err);
        loginError.innerText = '로그인 실패: 정보를 확인하세요.';
      }
    });

    // 로그아웃
    logoutBtn.addEventListener('click', async () => {
      try {
        await signOut(auth);
      } catch (err) {
        console.error('로그아웃 에러:', err);
      }
    });

    // 메모 저장 (선택한 카테고리 + HTML 서식 포함 저장)
    const saveBtn = document.getElementById('saveBtn');
    const statusText = document.getElementById('statusText');

    saveBtn.addEventListener('click', async () => {
      const htmlContent = quill.root.innerHTML;
      const textContent = quill.getText().trim();

      if (!textContent) return alert('내용을 입력하세요.');

      saveBtn.disabled = true;
      statusText.innerText = 'SAVING...';

      try {
        await addDoc(collection(db, "memos"), {
          content: htmlContent, // 서식 포함 데이터
          rawText: textContent,
          category: selectedCategory, // 선택한 카테고리
          createdAt: serverTimestamp()
        });

        quill.setText('');
        statusText.innerText = 'SAVED';
        setTimeout(() => { statusText.innerText = ''; }, 2000);
      } catch (err) {
        console.error('Firestore 저장 오류:', err);
        statusText.innerText = 'ERROR';
      } finally {
        saveBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
